<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAAREC • Painel Administrativo</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #151f2e;
      --line: #26364c;
      --text: #eaf2ff;
      --muted: #94a8c6;
      --blue: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 30px 20px; max-width: 960px; margin: 0 auto; }

    header { margin-bottom: 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
    header h1 { font-size: 22px; font-weight: 800; }
    .badge { font-size: 12px; background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.4); color: var(--green); padding: 4px 12px; border-radius: 99px; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; margin-bottom: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .card h2 { font-size: 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    input, select { width: 100%; padding: 12px 14px; background: #0e1726; border: 1px solid var(--line); border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
    input:focus { border-color: var(--blue); }

    .btn { padding: 12px 20px; background: linear-gradient(135deg, #2563eb, #3b82f6); border: none; border-radius: 10px; color: #fff; font-weight: 700; cursor: pointer; }
    .btn:active { transform: scale(0.98); }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; background: #0e1726; }
    td b { color: var(--blue); }
  </style>
</head>
<body>

  <header>
    <h1>🛶 VAAREC Admin • Gerenciador de Viewers</h1>
    <span class="badge">Painel Ativo</span>
  </header>

  <!-- Configuração das Credenciais do Supabase -->
  <section class="card">
    <h2>⚙️ Credenciais da Nuvem (Supabase)</h2>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
      <div class="form-group">
        <label for="supabase-url">URL do Projeto Supabase</label>
        <input type="text" id="supabase-url" placeholder="https://seu-projeto.supabase.co" />
      </div>
      <div class="form-group">
        <label for="supabase-key">Service Role Key (Chave Secreta de Admin)</label>
        <input type="password" id="supabase-key" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI..." />
      </div>
    </div>
    <p style="font-size: 12px; color: var(--muted);">Essas chaves são salvas com segurança apenas no seu navegador para uso nas edições.</p>
  </section>

  <!-- Upload e Publicação de Novo Viewer -->
  <section class="card">
    <h2>🚀 Publicar Novo Viewer (.json da prova)</h2>

    <div class="form-group">
      <label for="json-file">Arquivo JSON da Prova (exportado da ferramenta local)</label>
      <input type="file" id="json-file" accept=".json" />
    </div>

    <button class="btn" id="btn-publish">Fatiar e Publicar no Supabase Storage 📤</button>
    <div id="publish-status" style="margin-top: 12px; font-size: 13px; font-weight: 600;"></div>
  </section>

  <!-- Gerenciador de Share Links -->
  <section class="card">
    <h2>🔗 Gerar Link de Compartilhamento</h2>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
      <div class="form-group">
        <label for="viewer-slug">Slug do Viewer</label>
        <input type="text" id="viewer-slug" placeholder="ex: jurere-amador-fem-05-08-2026" />
      </div>
      <div class="form-group">
        <label for="max-uses">Limite de Usos (Nulo = Ilimitado)</label>
        <input type="number" id="max-uses" placeholder="Ex: 50" />
      </div>
    </div>
    <button class="btn" id="btn-create-link">Gerar Share Link 🔗</button>
    <div id="generated-link" style="margin-top: 14px; word-break: break-all; color: var(--green); font-weight: bold;"></div>
  </section>

  <script src="./admin.js"></script>
</body>
</html>
