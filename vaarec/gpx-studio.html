<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAAREC GPX Studio v2 — Editor de Trilhas</title>
  <meta name="description" content="Editor visual de trilhas GPS para VAAREC. Ajuste de UTC, largada/chegada, suavização, corte, auto-séries e exportação.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* ===== DESIGN SYSTEM ===== */
    :root {
      --bg: #07090e;
      --bg-panel: #0d131f;
      --bg-card: #121b2d;
      --bg-card-hover: #1a273f;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(0, 242, 254, 0.4);
      --cyan: #00F2FE;
      --cyan-dim: rgba(0, 242, 254, 0.12);
      --cyan-glow: rgba(0, 242, 254, 0.3);
      --gold: #F59E0B;
      --gold-dim: rgba(245, 158, 11, 0.15);
      --green: #10B981;
      --green-dim: rgba(16, 185, 129, 0.15);
      --red: #EF4444;
      --purple: #8B5CF6;
      --text: #F8FAFC;
      --text-sec: #94A3B8;
      --text-muted: #64748B;
      --font: 'Rajdhani', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); overflow: hidden; }

    #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

    /* ===== HEADER ===== */
    header {
      height: 44px; background: linear-gradient(90deg, #090e17, var(--bg-panel));
      border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; gap: 10px; flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand i { font-size: 18px; color: var(--cyan); text-shadow: 0 0 12px var(--cyan-glow); }
    .brand span { font-family: var(--font); font-size: 1.1rem; font-weight: 800; letter-spacing: 1px; }
    .brand .badge { font-size: 0.55rem; font-weight: 800; font-family: var(--font); background: var(--cyan-dim); border: 1px solid var(--cyan); color: var(--cyan); padding: 2px 6px; border-radius: 4px; }

    .hdr-actions { display: flex; align-items: center; gap: 6px; }
    .btn {
      font-family: var(--font); font-size: 0.76rem; font-weight: 700; padding: 5px 10px;
      border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-sec);
      cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: all 0.15s; text-decoration: none; white-space: nowrap;
    }
    .btn:hover { color: #fff; border-color: var(--cyan); background: var(--bg-card-hover); }
    .btn.primary { background: var(--cyan-dim); border-color: var(--cyan); color: var(--cyan); }
    .btn.primary:hover { box-shadow: 0 0 14px var(--cyan-glow); color: #fff; }
    .btn.green { background: var(--green-dim); border-color: var(--green); color: var(--green); }
    .btn.gold { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }
    .btn.danger { border-color: var(--red); color: var(--red); }
    .btn.sm { font-size: 0.7rem; padding: 3px 7px; }

    /* ===== TRACKS BAR ===== */
    #tracks-bar {
      background: var(--bg-panel); border-bottom: 1px solid var(--border);
      padding: 6px 14px; display: flex; align-items: center; gap: 6px; flex-shrink: 0; overflow-x: auto;
    }
    .track-pill {
      display: flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--bg-card); cursor: pointer; transition: all 0.15s; flex-shrink: 0;
    }
    .track-pill:hover { border-color: rgba(255,255,255,0.2); }
    .track-pill.active { border-color: var(--cyan); background: linear-gradient(135deg, rgba(0,242,254,0.08), var(--bg-card)); box-shadow: 0 0 10px rgba(0,242,254,0.1); }
    .track-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .track-pill-name { font-family: var(--font); font-size: 0.78rem; font-weight: 700; color: #fff; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .track-pill-meta { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-sec); }
    .track-pill-actions { display: flex; gap: 2px; }
    .btn-icon { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 4px; font-size: 10px; border-radius: 3px; }
    .btn-icon:hover { color: #fff; }

    .utc-select {
      background: var(--bg-card); border: 1px solid var(--border); color: var(--cyan); font-family: var(--font-mono);
      font-size: 0.65rem; padding: 2px 4px; border-radius: 4px; outline: none; width: 58px;
    }

    #tracks-bar-label { font-family: var(--font); font-size: 0.7rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0; }

    /* ===== MAIN AREA ===== */
    #main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* Chart toolbar */
    #chart-toolbar {
      height: 36px; background: var(--bg-panel); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 14px; flex-shrink: 0;
    }
    .toolbar-group { display: flex; align-items: center; gap: 5px; }
    .toggle-group { display: flex; gap: 0; background: rgba(0,0,0,0.4); padding: 2px; border-radius: 6px; border: 1px solid var(--border); }
    .toggle-btn {
      font-family: var(--font); font-size: 0.7rem; font-weight: 700; padding: 3px 8px;
      border: none; border-radius: 4px; background: transparent; color: var(--text-sec); cursor: pointer; transition: all 0.12s;
    }
    .toggle-btn.active { background: var(--cyan); color: #000; font-weight: 800; box-shadow: 0 0 8px var(--cyan-glow); }

    .dim-check { display: flex; align-items: center; gap: 3px; font-family: var(--font); font-size: 0.7rem; font-weight: 700; cursor: pointer; color: var(--text-sec); }
    .dim-check input { accent-color: var(--cyan); }
    .dim-check.active { color: #fff; }

    /* Chart container */
    #chart-container { flex: 1; position: relative; min-height: 200px; padding: 4px 10px; background: #05070c; }
    #chart-container canvas { width: 100% !important; height: 100% !important; }

    /* Needle info badges */
    .needle-badge {
      position: absolute; top: 6px; padding: 2px 6px; border-radius: 4px;
      font-family: var(--font-mono); font-size: 0.65rem; font-weight: 700; z-index: 20; pointer-events: none;
    }
    .needle-badge.start { background: rgba(16,185,129,0.2); color: var(--green); border: 1px solid var(--green); }
    .needle-badge.end { background: rgba(239,68,68,0.2); color: var(--red); border: 1px solid var(--red); }

    /* ===== ACTION TOOLBAR ===== */
    #action-toolbar {
      background: var(--bg-panel); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      padding: 6px 14px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; flex-wrap: wrap; gap: 4px;
    }

    /* Needle info bar */
    #needle-info {
      font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-sec);
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    #needle-info .ni-val { color: #fff; font-weight: 700; }
    #needle-info .ni-green { color: var(--green); }
    #needle-info .ni-red { color: var(--red); }

    /* Duration input */
    .dur-input-group { display: flex; align-items: center; gap: 4px; }
    .dur-input {
      width: 72px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 5px;
      color: #fff; font-family: var(--font-mono); font-size: 0.78rem; padding: 4px 6px; text-align: center; outline: none;
    }
    .dur-input:focus { border-color: var(--cyan); box-shadow: 0 0 8px var(--cyan-glow); }

    /* ===== BOTTOM SPLIT: MAP + STATS ===== */
    #bottom-split {
      height: 220px; display: grid; grid-template-columns: 1fr 320px;
      border-top: 1px solid var(--border); flex-shrink: 0;
    }
    #map-pane { position: relative; }
    #studio-map { width: 100%; height: 100%; background: #070a10; }

    #stats-pane {
      background: var(--bg-panel); border-left: 1px solid var(--border);
      padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
    }
    .stats-title { font-family: var(--font); font-size: 0.72rem; font-weight: 800; color: var(--cyan); text-transform: uppercase; letter-spacing: 1px; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .stat-card { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 5px; padding: 5px 7px; }
    .stat-lbl { font-size: 0.58rem; color: var(--text-muted); text-transform: uppercase; font-family: var(--font); font-weight: 700; }
    .stat-val { font-size: 0.82rem; font-weight: 700; color: #fff; font-family: var(--font-mono); margin-top: 2px; }

    /* Splits table */
    .splits-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 0.65rem; }
    .splits-table th { background: rgba(0,0,0,0.4); color: var(--cyan); font-family: var(--font); font-weight: 700; font-size: 0.62rem; padding: 3px 5px; border-bottom: 1px solid var(--border); text-align: left; }
    .splits-table td { padding: 3px 5px; border-bottom: 1px solid rgba(255,255,255,0.04); color: #E2E8F0; }

    /* ===== TOAST ===== */
    #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Popover */
    .popover {
      position: absolute; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px; min-width: 260px; box-shadow: 0 8px 24px rgba(0,0,0,0.7); z-index: 1000; display: none;
    }
    .popover.show { display: block; }
    .popover-title { font-family: var(--font); font-size: 0.85rem; font-weight: 800; color: #fff; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .form-row { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
    .form-lbl { font-family: var(--font); font-size: 0.72rem; font-weight: 700; color: var(--text-sec); }
    .form-input { background: var(--bg-card); border: 1px solid var(--border); border-radius: 5px; color: #fff; font-family: var(--font-mono); font-size: 0.82rem; padding: 6px 8px; outline: none; }
    .form-input:focus { border-color: var(--cyan); }
  </style>
</head>
<body>

<div id="app">

  <!-- HEADER -->
  <header>
    <div class="brand">
      <i class="fa-solid fa-sliders"></i>
      <span>VAAREC GPX STUDIO</span>
      <span class="badge">v2</span>
    </div>
    <div class="hdr-actions">
      <input type="file" id="file-uploader" accept=".gpx,.json,.txt,.fit" multiple style="display:none;" />
      <button class="btn" onclick="document.getElementById('file-uploader').click()">
        <i class="fa-solid fa-cloud-arrow-up"></i> Carregar GPS
      </button>
      <button class="btn" id="btn-load-demo"><i class="fa-solid fa-folder-open" style="color:var(--gold)"></i> Demo V1 Zimbros</button>
      <button class="btn green" id="btn-export-contract"><i class="fa-solid fa-floppy-disk"></i> Exportar JSON</button>
      <button class="btn gold" id="btn-export-events" title="Exportar apenas os eventos da prova em JSON para o gerador"><i class="fa-solid fa-bolt"></i> Eventos JSON</button>
      <button class="btn" id="btn-export-gpx"><i class="fa-solid fa-file-code"></i> Exportar GPX</button>
      <button class="btn primary" id="btn-send-to-generator" title="Grava o contrato tratado e abre o Gerador"><i class="fa-solid fa-paper-plane"></i> Enviar ao Gerador</button>
      <a href="/" class="btn"><i class="fa-solid fa-arrow-left"></i> Generator</a>
    </div>
  </header>

  <!-- TRACKS BAR -->
  <div id="tracks-bar">
    <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
      <span id="tracks-bar-label"><i class="fa-solid fa-layer-group"></i> Trilhas</span>
      <button class="btn sm" id="btn-auto-align-utc" title="Alinhar horários de largada de todas as trilhas automaticamente (correção de fuso/UTC)"><i class="fa-solid fa-wand-magic-sparkles" style="color:var(--gold)"></i> Auto-Alinhar UTC</button>
    </div>
    <div id="tracks-pills-container"></div>
  </div>

  <!-- MAIN CHART AREA -->
  <div id="main-area">

    <!-- Chart Toolbar -->
    <div id="chart-toolbar">
      <div class="toolbar-group">
        <!-- X Axis Toggle -->
        <span style="font-size:10px; color:var(--text-muted); font-weight:700;">EIXO X:</span>
        <div class="toggle-group" id="x-axis-toggle">
          <button class="toggle-btn active" data-mode="distance"><i class="fa-solid fa-ruler"></i> Distância</button>
          <button class="toggle-btn" data-mode="time"><i class="fa-solid fa-clock"></i> Tempo</button>
        </div>
        <span style="color:rgba(255,255,255,0.1); margin:0 4px;">|</span>
        <!-- Dimension Checks -->
        <label class="dim-check active"><input type="checkbox" data-dim="speed" checked> ⚡ Vel</label>
        <label class="dim-check"><input type="checkbox" data-dim="hr"> ❤️ FC</label>
        <label class="dim-check"><input type="checkbox" data-dim="ele"> ⛰ Alt</label>
        <label class="dim-check"><input type="checkbox" data-dim="heading"> 🧭 Rumo</label>
        <label class="dim-check"><input type="checkbox" data-dim="splits"> 📊 Splits</label>
      </div>
      <div class="toolbar-group">
        <button class="btn sm" id="btn-zoom-in" title="Zoom In"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
        <button class="btn sm" id="btn-zoom-out" title="Zoom Out"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
        <button class="btn sm" id="btn-zoom-reset" title="Reset Zoom"><i class="fa-solid fa-arrows-rotate"></i> Reset</button>
      </div>
    </div>

    <!-- Chart Canvas -->
    <div id="chart-container">
      <canvas id="main-chart"></canvas>
      <div class="needle-badge start" id="needle-badge-start" style="display:none;"></div>
      <div class="needle-badge end" id="needle-badge-end" style="display:none;"></div>
    </div>

    <!-- Action Toolbar -->
    <div id="action-toolbar">
      <div class="toolbar-group">
        <div id="needle-info">
          <span>🟢 Início: <span class="ni-val ni-green" id="ni-start">--</span></span>
          <span>🔴 Fim: <span class="ni-val ni-red" id="ni-end">--</span></span>
          <span>📏 <span class="ni-val" id="ni-extent">--</span></span>
        </div>
      </div>
      <div class="toolbar-group">
        <button class="btn sm primary" id="btn-trim-needles"><i class="fa-solid fa-crop-simple"></i> Cortar</button>
        <button class="btn sm danger" id="btn-remove-needles"><i class="fa-solid fa-trash"></i> Excluir</button>
        <button class="btn sm green" id="btn-extract-series"><i class="fa-solid fa-plus"></i> Nova Série</button>
        <button class="btn sm gold" id="btn-set-start"><i class="fa-solid fa-flag"></i> Largada</button>
        <button class="btn sm primary" id="btn-set-finish"><i class="fa-solid fa-trophy"></i> Chegada</button>
        <span style="color:rgba(255,255,255,0.1); margin:0 2px;">|</span>
        <div class="dur-input-group">
          <span style="font-size:0.68rem; color:var(--text-muted); font-weight:700; font-family:var(--font);">🏁+</span>
          <input type="text" class="dur-input" id="input-duration" placeholder="MM:SS" title="Largada + Duração = Chegada">
          <button class="btn sm" id="btn-apply-duration" title="Posicionar agulha de chegada pela duração"><i class="fa-solid fa-arrow-right"></i></button>
        </div>
        <span style="color:rgba(255,255,255,0.1); margin:0 2px;">|</span>
        <button class="btn sm" id="btn-smooth" title="Suavizar"><i class="fa-solid fa-water" style="color:var(--cyan)"></i> Suavizar</button>
        <button class="btn sm" id="btn-threshold" title="Linha de corte"><i class="fa-solid fa-broom" style="color:var(--purple)"></i> Corte</button>
        <button class="btn sm" id="btn-auto-events" title="Detectar e gerenciar eventos"><i class="fa-solid fa-bolt" style="color:var(--gold)"></i> Eventos <span id="lbl-events-count" class="badge" style="display:none; margin-left:3px; font-size:9px; padding:1px 5px; background:var(--gold); color:#000; font-weight:800;">0</span></button>
        <button class="btn sm" id="btn-auto-series" title="Auto-Séries"><i class="fa-solid fa-diagram-project" style="color:var(--gold)"></i> Séries</button>
        <span style="color:rgba(255,255,255,0.1); margin:0 2px;">|</span>
        <button class="btn sm" id="btn-undo"><i class="fa-solid fa-rotate-left"></i> Desfazer</button>
        <button class="btn sm danger" id="btn-reset"><i class="fa-solid fa-arrows-rotate"></i> Resetar</button>
      </div>
    </div>
  </div>

  <!-- BOTTOM: MAP + STATS -->
  <div id="bottom-split">
    <div id="map-pane"><div id="studio-map"></div></div>
    <div id="stats-pane">
      <div class="stats-title"><i class="fa-solid fa-chart-pie"></i> Resumo</div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-lbl">Distância</div><div class="stat-val" id="st-dist">--</div></div>
        <div class="stat-card"><div class="stat-lbl">Duração</div><div class="stat-val" id="st-dur">--</div></div>
        <div class="stat-card"><div class="stat-lbl">Vel. Média</div><div class="stat-val" id="st-spd-avg">--</div></div>
        <div class="stat-card"><div class="stat-lbl">Vel. Máx</div><div class="stat-val" id="st-spd-max">--</div></div>
        <div class="stat-card"><div class="stat-lbl">FC Média</div><div class="stat-val" id="st-hr-avg">--</div></div>
        <div class="stat-card"><div class="stat-lbl">FC Máx</div><div class="stat-val" id="st-hr-max">--</div></div>
      </div>
      <div class="stats-title" style="margin-top:6px;"><i class="fa-solid fa-chart-simple"></i> Splits (<span id="lbl-split-int">500m</span>)
        <select id="sel-split" style="background:var(--bg-card); border:1px solid var(--border); color:#fff; font-family:var(--font); font-size:10px; padding:1px 4px; border-radius:3px; outline:none; margin-left:4px;">
          <option value="250">250m</option><option value="500" selected>500m</option><option value="1000">1000m</option>
        </select>
      </div>
      <div id="splits-container" style="max-height:100px; overflow-y:auto;"></div>
    </div>
  </div>
</div>

<!-- POPOVERS -->
<div class="popover" id="pop-smooth" style="top: auto; bottom: 280px; right: 200px;">
  <div class="popover-title"><i class="fa-solid fa-water" style="color:var(--cyan)"></i> Suavização</div>
  <div style="display:flex; gap:5px; margin-bottom:8px;">
    <button class="btn sm" data-sw="5">🟢 Leve (5s)</button>
    <button class="btn sm primary" data-sw="9">🟡 Remada (9s)</button>
    <button class="btn sm" data-sw="15">🟣 Forte (15s)</button>
  </div>
  <div class="form-row">
    <label class="form-lbl">Janela (pontos):</label>
    <input type="range" id="range-smooth" min="3" max="31" step="2" value="9" style="width:100%;">
    <span id="val-smooth" style="font-family:var(--font-mono); font-size:0.72rem; color:var(--cyan);">9 pts</span>
  </div>
  <div style="display:flex; gap:4px; margin-top:4px;">
    <label style="font-size:0.72rem; display:flex; align-items:center; gap:4px; cursor:pointer; color:var(--text-sec);"><input type="checkbox" id="chk-smooth-all"> Todas as trilhas</label>
    <label style="font-size:0.72rem; display:flex; align-items:center; gap:4px; cursor:pointer; color:var(--text-sec);"><input type="checkbox" id="chk-smooth-hr"> Suavizar FC</label>
  </div>
  <div style="display:flex; gap:4px; margin-top:8px; justify-content:flex-end;">
    <button class="btn sm" onclick="document.getElementById('pop-smooth').classList.remove('show')">Cancelar</button>
    <button class="btn sm primary" id="btn-apply-smooth">🌊 Aplicar</button>
  </div>
</div>

<div class="popover" id="pop-threshold" style="top: auto; bottom: 280px; right: 150px;">
  <div class="popover-title"><i class="fa-solid fa-broom" style="color:var(--purple)"></i> Linha de Corte</div>
  <div class="form-row">
    <label class="form-lbl">Velocidade Mínima (km/h):</label>
    <input type="range" id="range-thresh-spd" min="0" max="12" step="0.5" value="6" style="width:100%;">
    <span id="val-thresh-spd" style="font-family:var(--font-mono); font-size:0.72rem; color:var(--cyan);">6.0 km/h</span>
  </div>
  <div style="display:flex; gap:4px; margin-top:8px; justify-content:flex-end;">
    <button class="btn sm" onclick="document.getElementById('pop-threshold').classList.remove('show')">Cancelar</button>
    <button class="btn sm primary" id="btn-apply-threshold">Aplicar Corte</button>
  </div>
</div>

<!-- ==========================================
     JAVASCRIPT ENGINE
     ========================================== -->
<script>
// ==========================================
// EMBEDDED GPX SKILLS (minimal — only needed functions)
// ==========================================

function haversineM(lat1, lon1, lat2, lon2) {
  const R = 6371008.8;
  const p1 = (lat1 * Math.PI) / 180, p2 = (lat2 * Math.PI) / 180;
  const dp = ((lat2 - lat1) * Math.PI) / 180, dl = ((lon2 - lon1) * Math.PI) / 180;
  const a = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1.0, Math.sqrt(a)));
}

function bearingDeg(lat1, lon1, lat2, lon2) {
  const p1 = (lat1 * Math.PI) / 180, p2 = (lat2 * Math.PI) / 180;
  const dl = ((lon2 - lon1) * Math.PI) / 180;
  const y = Math.sin(dl) * Math.cos(p2);
  const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

function calculateTrackSummary(points, name = '', source = '') {
  if (!points || !points.length) return { name, source, pointsCount: 0, distanceM: 0, durationS: 0, speedAvgKmh: null, speedMaxKmh: null, movingTimeS: 0, stoppedTimeS: 0, hrAvg: null, hrMax: null };
  let totalDistM = 0; const speeds = [], hrs = [];
  const t0 = Number(points[0].t ?? 0), tEnd = Number(points[points.length - 1].t ?? 0);
  const isMs = (tEnd - t0) > 100000;
  const totalDurationS = isMs ? (tEnd - t0) / 1000 : (tEnd - t0);
  let movingTimeS = 0;
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    if (p.spdKmh != null && !isNaN(p.spdKmh) && p.spdKmh >= 0) speeds.push(Number(p.spdKmh));
    if (p.hr != null && !isNaN(p.hr) && p.hr > 30) hrs.push(Number(p.hr));
    if (i > 0) {
      const prev = points[i - 1];
      totalDistM += haversineM(prev.lat, prev.lon ?? prev.lng, p.lat, p.lon ?? p.lng);
      const dtS = isMs ? (p.t - prev.t) / 1000 : (p.t - prev.t);
      if ((p.spdKmh || 0) > 2.0 && dtS > 0 && dtS < 120) movingTimeS += dtS;
    }
  }
  return {
    name, source, pointsCount: points.length, distanceM: Math.round(totalDistM),
    durationS: Math.round(totalDurationS), movingTimeS: Math.round(movingTimeS),
    stoppedTimeS: Math.round(totalDurationS - movingTimeS),
    speedAvgKmh: speeds.length ? Number((speeds.reduce((a, b) => a + b, 0) / speeds.length).toFixed(1)) : null,
    speedMaxKmh: speeds.length ? Number(Math.max(...speeds).toFixed(1)) : null,
    hrAvg: hrs.length ? Math.round(hrs.reduce((a, b) => a + b, 0) / hrs.length) : null,
    hrMax: hrs.length ? Math.max(...hrs) : null
  };
}

function segmentTrackByDistance(points, intervalM = 500, trackId = '') {
  if (!points || points.length < 2) return [];
  const segments = []; let accDist = 0, segStart = 0, segStartM = 0;
  const t0 = points[0].t, isMs = (points[points.length - 1].t - t0) > 100000;
  for (let i = 1; i < points.length; i++) {
    accDist += haversineM(points[i - 1].lat, points[i - 1].lon ?? points[i - 1].lng, points[i].lat, points[i].lon ?? points[i].lng);
    if (accDist - segStartM >= intervalM || i === points.length - 1) {
      const slice = points.slice(segStart, i + 1);
      const dS = isMs ? (slice[slice.length - 1].t - slice[0].t) / 1000 : (slice[slice.length - 1].t - slice[0].t);
      const dM = Math.round(accDist - segStartM);
      if (dM < 20 && i === points.length - 1 && segments.length > 0) break;
      const spds = slice.filter(p => p.spdKmh != null && p.spdKmh > 0).map(p => p.spdKmh);
      const hrs = slice.filter(p => p.hr != null && p.hr > 30).map(p => p.hr);
      const avgSpd = (dM > 0 && dS > 0) ? Number(((dM / dS) * 3.6).toFixed(1)) : (spds.length ? Number((spds.reduce((a, b) => a + b, 0) / spds.length).toFixed(1)) : 0);
      const paceMinKm = avgSpd > 0 ? 60 / avgSpd : 0;
      const paceMin = Math.floor(paceMinKm);
      const paceSec = Math.round((paceMinKm - paceMin) * 60);
      const paceStr = avgSpd > 0 ? `${paceMin}:${String(paceSec).padStart(2, '0')}` : '--';
      segments.push({
        segmentId: `${Math.round(segStartM)}-${Math.round(accDist)}m`,
        trackId,
        startM: Math.round(segStartM),
        endM: Math.round(accDist),
        distanceM: dM,
        durationS: Math.round(dS),
        speedAvgKmh: avgSpd,
        paceStr,
        hrAvg: hrs.length ? Math.round(hrs.reduce((a, b) => a + b, 0) / hrs.length) : null,
        hrMax: hrs.length ? Math.max(...hrs) : null
      });
      segStart = i; segStartM = accDist;
    }
  }
  return segments;
}

function ensureTrackPointSplits(track, intervalM = 500) {
  if (!track || !track.points || !track.points.length) return;
  track.segments = segmentTrackByDistance(track.points, intervalM, track.id);
  
  let accM = 0;
  let segIdx = 0;
  const segs = track.segments;
  if (!segs.length) return;

  for (let i = 0; i < track.points.length; i++) {
    const p = track.points[i];
    if (i > 0) {
      accM += haversineM(track.points[i - 1].lat, track.points[i - 1].lon ?? track.points[i - 1].lng, p.lat, p.lon ?? p.lng);
    }
    while (segIdx < segs.length - 1 && accM > segs[segIdx].endM) {
      segIdx++;
    }
    const curSeg = segs[segIdx] || segs[segs.length - 1];
    p.splitSpd = curSeg ? curSeg.speedAvgKmh : (p.spdKmh || 0);
    p.splitSeg = curSeg ? curSeg.segmentId : '';
    p.splitPace = curSeg ? curSeg.paceStr : '--';
  }
}

function smoothTrackSpeed(points, windowSize = 7, smoothHR = false) {
  if (!points || points.length < windowSize) return points;
  const half = Math.floor(windowSize / 2);
  return points.map((p, i) => {
    const start = Math.max(0, i - half), end = Math.min(points.length - 1, i + half);
    const slice = points.slice(start, end + 1);
    const avgSpd = slice.reduce((sum, sp) => sum + (sp.spdKmh || 0), 0) / slice.length;
    const result = { ...p, spdKmh: Number(avgSpd.toFixed(2)) };
    if (smoothHR && p.hr) {
      const avgHR = Math.round(slice.filter(sp => sp.hr).reduce((sum, sp) => sum + sp.hr, 0) / slice.filter(sp => sp.hr).length);
      result.hr = avgHR;
    }
    return result;
  });
}

function calculateEfficiencyMetrics(points) {
  if (!points || !points.length) return {};
  const correlationData = [];
  points.forEach(p => { if (p.spdKmh && p.hr && p.hr > 60) correlationData.push({ x: p.spdKmh, y: p.hr }); });
  return { correlationData };
}

function autoDetectIntervalSeriesAdaptive(points, config = {}) {
  if (!points || points.length < 10) return [];
  const { mode = 'speed', minSpeedKmh = 10, minDurationS = 20, intervalM = 1000, intervalS = 300 } = config;
  const series = [];
  if (mode === 'speed') {
    let inSeries = false, startIdx = 0;
    const t0 = points[0].t, isMs = (points[points.length - 1].t - t0) > 100000;
    for (let i = 0; i < points.length; i++) {
      if (!inSeries && (points[i].spdKmh || 0) >= minSpeedKmh) { inSeries = true; startIdx = i; }
      else if (inSeries && ((points[i].spdKmh || 0) < minSpeedKmh || i === points.length - 1)) {
        const dur = isMs ? (points[i].t - points[startIdx].t) / 1000 : (points[i].t - points[startIdx].t);
        if (dur >= minDurationS) {
          series.push({ name: `Série ${series.length + 1}`, points: points.slice(startIdx, i + 1) });
        }
        inSeries = false;
      }
    }
  } else if (mode === 'distance') {
    let accDist = 0, lastCut = 0;
    for (let i = 1; i < points.length; i++) {
      accDist += haversineM(points[i - 1].lat, points[i - 1].lon ?? points[i - 1].lng, points[i].lat, points[i].lon ?? points[i].lng);
      if (accDist - lastCut >= intervalM) {
        series.push({ name: `${Math.round(lastCut)}-${Math.round(accDist)}m`, points: points.slice(Math.max(0, i - Math.round(intervalM / 3)), i + 1) });
        lastCut = accDist;
      }
    }
  }
  return series;
}

function autoDetectAllRaceEvents(tracks, opts = {}) {
  const events = [];
  if (!tracks || !tracks.length) return events;

  tracks.forEach(t => {
    if (!t.visible || !t.points || t.points.length < 10) return;
    const pts = t.points;
    const isMs = pts.length > 1 && (pts[pts.length - 1].t - pts[0].t) > 100000;
    const t0 = pts[0].t;

    let accDistM = 0;
    const ptsWithDist = pts.map((p, idx) => {
      if (idx > 0) {
        accDistM += haversineM(pts[idx - 1].lat, pts[idx - 1].lon ?? pts[idx - 1].lng, p.lat, p.lon ?? p.lng);
      }
      return { ...p, distM: accDistM, idx };
    });

    let lastSprintTimeS = -999;
    let lastTurnTimeS = -999;

    // 1. Detect True Peak Speed
    let maxSpd = 0, maxSpdIdx = -1;
    ptsWithDist.forEach((p, idx) => {
      if (p.spdKmh != null && p.spdKmh > maxSpd && p.spdKmh < 35) { // filter GPS teleport glitch
        maxSpd = p.spdKmh;
        maxSpdIdx = idx;
      }
    });

    if (maxSpd >= 11 && maxSpdIdx >= 0) {
      const p = ptsWithDist[maxSpdIdx];
      const elapsedS = isMs ? (p.t - t0) / 1000 : (p.t - t0);
      events.push({
        id: `evt-maxspd-${t.id}`,
        type: 'MAX_SPEED',
        typeLabel: 'Velocidade Máxima',
        name: `Vel. Máx ${t.name}`,
        trackId: t.id,
        trackName: t.name,
        pointIdx: maxSpdIdx,
        t: p.t,
        absT: p.absT || p.t,
        timeSeconds: Math.round(elapsedS),
        distanceMeters: Math.round(p.distM),
        speedKmh: Number(maxSpd.toFixed(1)),
        lat: p.lat,
        lon: p.lon ?? p.lng,
        details: `${maxSpd.toFixed(1)} km/h`,
        color: '#00F2FE',
        icon: 'fa-gauge-high'
      });
    }

    // 2. Detect Significant Sprints (> 12.8 km/h & acceleration > 1.35x, debounced 60s)
    for (let i = 5; i < ptsWithDist.length - 5; i++) {
      const cur = ptsWithDist[i];
      const prev = ptsWithDist[i - 5];
      const curSpd = cur.spdKmh || 0;
      const prevSpd = prev.spdKmh || 0;
      const elapsedS = isMs ? (cur.t - t0) / 1000 : (cur.t - t0);

      if (curSpd >= 13.0 && curSpd > prevSpd * 1.35 && (elapsedS - lastSprintTimeS) > 60) {
        lastSprintTimeS = elapsedS;
        events.push({
          id: `evt-sprint-${t.id}-${i}`,
          type: 'SPRINT',
          typeLabel: 'Sprint / Ataque',
          name: `Sprint ${t.name}`,
          trackId: t.id,
          trackName: t.name,
          pointIdx: i,
          t: cur.t,
          absT: cur.absT || cur.t,
          timeSeconds: Math.round(elapsedS),
          distanceMeters: Math.round(cur.distM),
          speedKmh: Number(curSpd.toFixed(1)),
          lat: cur.lat,
          lon: cur.lon ?? cur.lng,
          details: `${curSpd.toFixed(1)} km/h`,
          color: '#F59E0B',
          icon: 'fa-bolt'
        });
      }

      // 3. Detect Significant Buoy Turns (Heading delta >= 40° across 10s, debounced 90s)
      if (cur.heading != null && prev.heading != null && (elapsedS - lastTurnTimeS) > 90) {
        let diff = Math.abs(cur.heading - prev.heading);
        if (diff > 180) diff = 360 - diff;
        if (diff >= 40) {
          lastTurnTimeS = elapsedS;
          events.push({
            id: `evt-turn-${t.id}-${i}`,
            type: 'BUOY_TURN',
            typeLabel: 'Curva / Boia',
            name: `Curva ${t.name}`,
            trackId: t.id,
            trackName: t.name,
            pointIdx: i,
            t: cur.t,
            absT: cur.absT || cur.t,
            timeSeconds: Math.round(elapsedS),
            distanceMeters: Math.round(cur.distM),
            speedKmh: Number(curSpd.toFixed(1)),
            lat: cur.lat,
            lon: cur.lon ?? cur.lng,
            details: `Δ${Math.round(diff)}°`,
            color: '#8B5CF6',
            icon: 'fa-rotate-right'
          });
        }
      }
    }
  });

  return events.sort((a, b) => (a.t || 0) - (b.t || 0));
}

function cropTrackByAbsoluteTime(points, startHMS, durationS) {
  if (!points || !points.length) return points;
  let result = [...points];
  if (startHMS) {
    const parts = startHMS.split(':').map(Number);
    if (parts.length >= 2) {
      const targetMs = ((parts[0] || 0) * 3600 + (parts[1] || 0) * 60 + (parts[2] || 0)) * 1000;
      let found = -1;
      for (let i = 0; i < result.length; i++) {
        const d = new Date(result[i].absT || result[i].t);
        const ms = (d.getUTCHours() * 3600 + d.getUTCMinutes() * 60 + d.getUTCSeconds()) * 1000;
        if (ms >= targetMs) { found = i; break; }
      }
      if (found > 0) result = result.slice(found);
    }
  }
  if (durationS && durationS > 0) {
    const t0 = result[0]?.t;
    if (t0 != null) {
      const isMs = result.length > 1 && (result[result.length - 1].t - t0) > 100000;
      const targetT = isMs ? t0 + durationS * 1000 : t0 + durationS;
      let eIdx = result.length - 1;
      for (let i = 0; i < result.length; i++) { if (result[i].t >= targetT) { eIdx = i; break; } }
      result = result.slice(0, eIdx + 1);
    }
  }
  return result;
}

// ==========================================
// GPX STUDIO CONTROLLER (inline v2 — simplified)
// ==========================================

class GPXStudioControllerV2 {
  constructor() {
    this.tracks = [];
    this.activeTrackIdx = 0;
    this.splitIntervalM = 500;
    this.historyStack = [];
    this.customEvents = [];
    this.chartZoom = { minFrac: 0.0, maxFrac: 1.0, isZoomed: false };
    this.needles = { start: { frac: 0.0, active: false }, end: { frac: 1.0, active: false } };
    this.xAxisMode = 'distance';
    this.visibleDimensions = ['speed'];
    this.thresholdLine = null; // { value: km/h, visible: false }
    this.map = null;
    this.mapLayers = { tracks: new Map(), selectionHighlight: null };
    this.callbacks = [];
  }

  subscribe(cb) { this.callbacks.push(cb); }
  _notify(t) { this.callbacks.forEach(c => c(t, this)); }

  // ---- Track management ----
  addTrack(name, rawPoints, color = null, fileName = '') {
    if (!rawPoints || rawPoints.length < 2) return null;
    const COLORS = ['#00F2FE', '#F59E0B', '#10B981', '#EF4444', '#8B5CF6', '#F43F5E', '#3B82F6', '#EC4899'];
    const trackColor = color || COLORS[this.tracks.length % COLORS.length];
    const id = `t_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`;
    const points = this._normalize(rawPoints);
    const summary = calculateTrackSummary(points, name, fileName);
    const segments = segmentTrackByDistance(points, this.splitIntervalM, id);
    const trackObj = { id, name, fileName, color: trackColor, originalPoints: [...points], points: [...points], visible: true, summary, segments, utcOffsetH: 0 };
    this.tracks.push(trackObj);
    this.activeTrackIdx = this.tracks.length - 1;
    this._updateMap();
    this._notify('track-added');
    return trackObj;
  }

  removeTrack(idx) {
    if (idx >= 0 && idx < this.tracks.length) {
      const r = this.tracks.splice(idx, 1)[0];
      if (this.mapLayers.tracks.has(r.id) && this.map) { this.map.removeLayer(this.mapLayers.tracks.get(r.id)); this.mapLayers.tracks.delete(r.id); }
      this.activeTrackIdx = Math.max(0, Math.min(this.activeTrackIdx, this.tracks.length - 1));
      this._updateMap(); this._notify('track-removed');
    }
  }

  setActiveTrack(idx) { if (idx >= 0 && idx < this.tracks.length) { this.activeTrackIdx = idx; this._notify('active-changed'); } }
  toggleVisibility(idx) { if (this.tracks[idx]) { this.tracks[idx].visible = !this.tracks[idx].visible; this._updateMap(); this._notify('visibility-changed'); } }
  getActiveTrack() { return this.tracks[this.activeTrackIdx] || null; }

  // ---- Needles ----
  setNeedle(which, frac) {
    frac = Math.max(0, Math.min(1, frac));
    if (which === 'start') { this.needles.start.frac = Math.min(frac, this.needles.end.frac - 0.002); this.needles.start.active = true; }
    else { this.needles.end.frac = Math.max(frac, this.needles.start.frac + 0.002); this.needles.end.active = true; }
    this._updateMapHighlight();
    this._notify('needle-moved');
  }

  getNeedleIdx(which) {
    const t = this.getActiveTrack(); if (!t || !t.points.length) return 0;
    return Math.round((which === 'start' ? this.needles.start.frac : this.needles.end.frac) * (t.points.length - 1));
  }

  getNeedleInfo(which) {
    const t = this.getActiveTrack(); if (!t || !t.points.length) return null;
    const idx = this.getNeedleIdx(which);
    const p = t.points[idx]; if (!p) return null;
    let dist = 0;
    for (let i = 1; i <= idx; i++) dist += haversineM(t.points[i-1].lat, t.points[i-1].lon, t.points[i].lat, t.points[i].lon);
    const t0 = t.points[0].t, isMs = (t.points[t.points.length-1].t - t0) > 100000;
    const relS = isMs ? (p.t - t0) / 1000 : (p.t - t0);
    return { idx, distM: Math.round(dist), distKm: (dist/1000).toFixed(2), relS: Math.round(relS), spdKmh: p.spdKmh || 0, hr: p.hr };
  }

  resetNeedles() {
    this.needles = { start: { frac: 0.0, active: false }, end: { frac: 1.0, active: false } };
    this._clearHighlight(); this._notify('needles-reset');
  }

  // ---- Trim / Cut / Extract ----
  _recalc(t) {
    t.summary = calculateTrackSummary(t.points, t.name, t.fileName);
    t.segments = segmentTrackByDistance(t.points, this.splitIntervalM, t.id);
  }

  trimToNeedles() {
    const t = this.getActiveTrack(); if (!t) return;
    const s = this.getNeedleIdx('start'), e = this.getNeedleIdx('end');
    if (e - s < 2) return;
    this.historyStack.push({ id: t.id, pts: [...t.points] });
    t.points = this._normalize(t.points.slice(s, e + 1));
    this._recalc(t); this.resetNeedles(); this._updateMap(); this._notify('trimmed');
  }

  removeInterval() {
    const t = this.getActiveTrack(); if (!t) return;
    const s = this.getNeedleIdx('start'), e = this.getNeedleIdx('end');
    if (e - s < 2) return;
    this.historyStack.push({ id: t.id, pts: [...t.points] });
    t.points = this._normalize([...t.points.slice(0, s), ...t.points.slice(e + 1)]);
    this._recalc(t); this.resetNeedles(); this._updateMap(); this._notify('removed');
  }

  extractSeries() {
    const t = this.getActiveTrack(); if (!t) return;
    const s = this.getNeedleIdx('start'), e = this.getNeedleIdx('end');
    if (e - s < 2) return;
    this.addTrack(`${t.name} (Série ${this.tracks.length + 1})`, t.points.slice(s, e + 1), null, t.fileName);
  }

  setStartAtNeedle(all = true) {
    const targets = all ? this.tracks : [this.getActiveTrack()].filter(Boolean);
    const sIdx = this.getNeedleIdx('start');
    targets.forEach(t => {
      this.historyStack.push({ id: t.id, pts: [...t.points] });
      const idx = Math.min(sIdx, t.points.length - 2);
      t.points = this._normalize(t.points.slice(idx));
      this._recalc(t);
    });
    this.resetNeedles(); this._updateMap(); this._notify('start-set');
  }

  _interpolatePoint(p1, p2, targetT) {
    const dt = (p2.t - p1.t);
    if (dt === 0) return { ...p1, t: targetT, absT: p1.absT != null ? p1.absT : targetT };
    const alpha = Math.max(0, Math.min(1, (targetT - p1.t) / dt));

    const lat = p1.lat + alpha * (p2.lat - p1.lat);
    const lon = p1.lon + alpha * (p2.lon - p1.lon);
    const ele = (p1.ele != null && p2.ele != null) ? p1.ele + alpha * (p2.ele - p1.ele) : (p1.ele ?? p2.ele ?? 0);
    const spdKmh = (p1.spdKmh != null && p2.spdKmh != null) ? Number((p1.spdKmh + alpha * (p2.spdKmh - p1.spdKmh)).toFixed(2)) : (p1.spdKmh ?? p2.spdKmh ?? 0);
    const hr = (p1.hr != null && p2.hr != null) ? Math.round(p1.hr + alpha * (p2.hr - p1.hr)) : (p1.hr ?? p2.hr ?? null);

    let heading = p1.heading;
    if (p1.heading != null && p2.heading != null) {
      let diff = p2.heading - p1.heading;
      if (diff > 180) diff -= 360;
      if (diff < -180) diff += 360;
      heading = (p1.heading + alpha * diff + 360) % 360;
    }

    let absT = targetT;
    if (p1.absT != null && p2.absT != null) {
      absT = Math.round(p1.absT + alpha * (p2.absT - p1.absT));
    } else if (p1.t > 1e11) {
      absT = targetT;
    }

    return {
      lat,
      lon,
      ele: Number(ele.toFixed(2)),
      t: targetT,
      absT,
      spdKmh,
      hr,
      heading: heading != null ? Number(heading.toFixed(1)) : undefined
    };
  }

  ensurePointAtTime(track, targetT) {
    if (!track || !track.points.length) return -1;
    const pts = track.points;
    if (targetT <= pts[0].t) return 0;
    if (targetT >= pts[pts.length - 1].t) return pts.length - 1;

    for (let i = 0; i < pts.length; i++) {
      if (Math.abs(pts[i].t - targetT) <= 2) {
        return i; // Already exact
      }
      if (pts[i].t > targetT) {
        // Interpolate between i-1 and i
        const newPt = this._interpolatePoint(pts[i - 1], pts[i], targetT);
        pts.splice(i, 0, newPt);
        this._recalc(track);
        return i;
      }
    }
    return pts.length - 1;
  }

  setFinishAtNeedle(all = true) {
    const activeT = this.getActiveTrack();
    if (!activeT || !activeT.points.length) return;

    const sIdx = this.getNeedleIdx('start');
    const eIdx = this.getNeedleIdx('end');
    const startP = activeT.points[sIdx];
    const endP = activeT.points[eIdx];
    const isMs = (activeT.points[activeT.points.length - 1].t - activeT.points[0].t) > 100000;
    const raceDurationS = isMs ? (endP.t - startP.t) / 1000 : (endP.t - startP.t);

    const targets = all ? this.tracks : [activeT];
    targets.forEach(t => {
      if (!t.points.length) return;
      this.historyStack.push({ id: t.id, pts: [...t.points] });

      if (t.id === activeT.id) {
        t.points = this._normalize(t.points.slice(0, eIdx + 1));
      } else {
        const t0 = t.points[0].t;
        const targetFinishT = isMs ? t0 + raceDurationS * 1000 : t0 + raceDurationS;
        const targetIdx = this.ensurePointAtTime(t, targetFinishT);
        t.points = this._normalize(t.points.slice(0, targetIdx + 1));
      }
      this._recalc(t);
    });
    this.resetNeedles(); this._updateMap(); this._notify('finish-set');
  }

  setFinishByDuration(durStr) {
    const parts = durStr.split(':').map(Number);
    let durS = 0;
    if (parts.length === 3) durS = parts[0] * 3600 + parts[1] * 60 + parts[2];
    else if (parts.length === 2) durS = parts[0] * 60 + parts[1];
    else durS = parts[0];
    if (durS <= 0) return;

    const t = this.getActiveTrack(); if (!t || !t.points.length) return;
    const sIdx = this.getNeedleIdx('start');
    const startP = t.points[sIdx];
    const t0 = startP.t;
    const isMs = (t.points[t.points.length - 1].t - t.points[0].t) > 100000;
    const targetT = isMs ? t0 + durS * 1000 : t0 + durS;

    this.historyStack.push({ id: t.id, pts: [...t.points] });

    // Interpolate point at exact targetT in active track
    const endIdx = this.ensurePointAtTime(t, targetT);

    // Also interpolate in other tracks so all tracks have a point at the exact duration
    this.tracks.forEach(otherT => {
      if (otherT.id === t.id || !otherT.points.length) return;
      const otherT0 = otherT.points[0].t;
      const otherTargetT = isMs ? otherT0 + durS * 1000 : otherT0 + durS;
      this.ensurePointAtTime(otherT, otherTargetT);
    });

    if (endIdx >= 0) {
      this.setNeedle('end', endIdx / (t.points.length - 1));
    }
    this._updateMap();
    this._notify('finish-duration-set');
  }

  // ---- UTC Offset ----
  applyUTCOffset(idx, offsetH) {
    const t = this.tracks[idx]; if (!t) return;
    const prev = t.utcOffsetH || 0;
    const deltaMs = (offsetH - prev) * 3600 * 1000;
    this.historyStack.push({ id: t.id, pts: [...t.points] });
    t.points = t.points.map(p => ({ ...p, t: p.t + (p.t > 1e11 ? deltaMs : deltaMs / 1000), absT: (p.absT || p.t) + deltaMs }));
    t.utcOffsetH = offsetH;
    this._recalc(t); this._updateMap(); this._notify('utc-changed');
  }

  alignAllTrackStartTimes() {
    if (this.tracks.length < 2) return;
    const refT = this.tracks[0];
    if (!refT.points.length) return;
    const refT0 = refT.points[0].absT || refT.points[0].t;
    const refDate = new Date(refT0);
    const refHour = refDate.getUTCHours();

    this.tracks.forEach((t, i) => {
      if (i === 0 || !t.points.length) return;
      const t0 = t.points[0].absT || t.points[0].t;
      const d = new Date(t0);
      const hour = d.getUTCHours();
      let diffH = refHour - hour;
      if (diffH > 12) diffH -= 24;
      if (diffH < -12) diffH += 24;
      if (diffH !== 0) {
        this.applyUTCOffset(i, diffH);
      }
    });
    this._notify('utc-changed');
  }

  // ---- Smoothing ----
  applySmoothing(windowSize = 9, smoothHR = false, allTracks = false) {
    const targets = allTracks ? this.tracks : [this.getActiveTrack()].filter(Boolean);
    targets.forEach(t => {
      this.historyStack.push({ id: t.id, pts: [...t.points] });
      t.points = smoothTrackSpeed(t.points, windowSize, smoothHR);
      this._recalc(t);
    });
    this._updateMap(); this._notify('smoothed');
  }

  // ---- Threshold / Filter ----
  filterByThreshold(minSpd) {
    const t = this.getActiveTrack(); if (!t) return;
    this.historyStack.push({ id: t.id, pts: [...t.points] });
    t.points = t.points.filter(p => (p.spdKmh || 0) >= minSpd);
    if (t.points.length > 1) t.points = this._normalize(t.points);
    this._recalc(t); this._updateMap(); this._notify('filtered');
  }

  // ---- Auto Events ----
  autoDetectEvents() {
    const evts = autoDetectAllRaceEvents(this.tracks);
    this.customEvents = [...evts, ...this.customEvents.filter(e => e.id.startsWith('evt-usr-'))];
    this._updateMap();
    this._notify('events-detected');
    return this.customEvents;
  }

  exportEventsJSON() {
    if (!this.customEvents || !this.customEvents.length) {
      this.autoDetectEvents();
    }
    if (!this.customEvents.length) return null;

    const data = {
      version: '2.0',
      generator: 'VAAREC GPX Studio v2',
      type: 'VAAREC_EVENTS',
      createdAt: new Date().toISOString(),
      eventsCount: this.customEvents.length,
      tracks: this.tracks.map(t => ({ id: t.id, name: t.name, color: t.color })),
      events: this.customEvents
    };
    return JSON.stringify(data, null, 2);
  }

  // ---- Auto Series ----
  autoSeries(config = {}) {
    const t = this.getActiveTrack(); if (!t) return [];
    const detected = autoDetectIntervalSeriesAdaptive(t.points, config);
    detected.forEach(s => this.addTrack(`${t.name} - ${s.name}`, s.points, null, t.fileName));
    this._notify('series-created');
    return detected;
  }

  // ---- Undo / Reset ----
  undo() {
    if (!this.historyStack.length) return;
    const last = this.historyStack.pop();
    const t = this.tracks.find(tr => tr.id === last.id);
    if (t) { t.points = [...last.pts]; this._recalc(t); this._updateMap(); this._notify('undo'); }
  }

  resetTrack() {
    const t = this.getActiveTrack(); if (!t) return;
    t.points = [...t.originalPoints];
    this._recalc(t); this.resetNeedles(); this._updateMap(); this._notify('reset');
  }

  // ---- Zoom / Pan ----
  zoom(factor, centerFrac = 0.5) {
    const span = this.chartZoom.maxFrac - this.chartZoom.minFrac;
    const newSpan = Math.max(0.02, Math.min(1, span * factor));
    const center = this.chartZoom.minFrac + span * centerFrac;
    let mn = center - newSpan * centerFrac, mx = center + newSpan * (1 - centerFrac);
    if (mn < 0) { mx = Math.min(1, mx - mn); mn = 0; }
    if (mx > 1) { mn = Math.max(0, mn - (mx - 1)); mx = 1; }
    this.chartZoom.minFrac = mn; this.chartZoom.maxFrac = mx;
    this.chartZoom.isZoomed = (mn > 0 || mx < 1);
    this._notify('zoom-changed');
  }

  pan(deltaFrac) {
    const span = this.chartZoom.maxFrac - this.chartZoom.minFrac;
    let mn = this.chartZoom.minFrac + deltaFrac, mx = this.chartZoom.maxFrac + deltaFrac;
    if (mn < 0) { mx -= mn; mn = 0; }
    if (mx > 1) { mn -= (mx - 1); mx = 1; }
    this.chartZoom.minFrac = Math.max(0, mn); this.chartZoom.maxFrac = Math.min(1, mx);
    this.chartZoom.isZoomed = (this.chartZoom.minFrac > 0 || this.chartZoom.maxFrac < 1);
    this._notify('zoom-changed');
  }

  resetZoom() {
    this.chartZoom = { minFrac: 0, maxFrac: 1, isZoomed: false };
    this._notify('zoom-changed');
  }

  // ---- Export ----
  generateContract(name = 'Sessão GPX Studio') {
    return {
      version: '2.0', generator: 'VAAREC GPX Studio v2', name,
      date: new Date().toLocaleDateString('pt-BR'), createdAt: new Date().toISOString(),
      sportPackage: { tracks: this.tracks.map((t, i) => ({ id: t.id || `canoe_${i + 1}`, name: t.name, color: t.color, fileName: t.fileName, points: t.points, summary: t.summary, segments: t.segments })) },
      events: { custom: this.customEvents, all: this.customEvents }
    };
  }

  exportGPX(idx = this.activeTrackIdx) {
    const t = this.tracks[idx]; if (!t || !t.points.length) return '';
    const pts = t.points, base = pts[0].absT || Date.now();
    let xml = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="VAAREC GPX Studio v2" xmlns="http://www.topografix.com/GPX/1/1" xmlns:gpxtpx="http://www.garmin.com/xmlschemas/TrackPointExtension/v1">\n  <metadata><name>${t.name}</name><time>${new Date(base).toISOString()}</time></metadata>\n  <trk><name>${t.name}</name><trkseg>\n`;
    pts.forEach(p => {
      const ts = new Date(p.absT || (base + p.t)).toISOString();
      xml += `    <trkpt lat="${p.lat.toFixed(7)}" lon="${p.lon.toFixed(7)}">`;
      if (p.ele != null) xml += `<ele>${p.ele.toFixed(2)}</ele>`;
      xml += `<time>${ts}</time>`;
      if (p.hr != null || p.spdKmh != null) {
        xml += `<extensions><gpxtpx:TrackPointExtension>`;
        if (p.hr != null) xml += `<gpxtpx:hr>${p.hr}</gpxtpx:hr>`;
        if (p.spdKmh != null) xml += `<gpxtpx:speed>${(p.spdKmh / 3.6).toFixed(2)}</gpxtpx:speed>`;
        xml += `</gpxtpx:TrackPointExtension></extensions>`;
      }
      xml += `</trkpt>\n`;
    });
    xml += `  </trkseg></trk>\n</gpx>`;
    return xml;
  }

  // ---- Map ----
  initMap(elId) {
    if (typeof L === 'undefined') return;
    const el = document.getElementById(elId); if (!el) return;
    this.map = L.map(elId, { zoomControl: false, attributionControl: true }).setView([-27.43, -48.48], 13);
    L.control.zoom({ position: 'bottomright' }).addTo(this.map);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, attribution: '© Esri' }).addTo(this.map);
  }

  _updateMap() {
    if (!this.map) return;
    this.mapLayers.tracks.forEach((layer, id) => { if (!this.tracks.find(t => t.id === id && t.visible)) { this.map.removeLayer(layer); this.mapLayers.tracks.delete(id); } });
    this.tracks.forEach((t, idx) => {
      if (!t.visible) return;
      const ll = t.points.map(p => [p.lat, p.lon]);
      const isSel = idx === this.activeTrackIdx;
      if (this.mapLayers.tracks.has(t.id)) { const l = this.mapLayers.tracks.get(t.id); l.setLatLngs(ll); l.setStyle({ color: t.color, weight: isSel ? 4 : 2, opacity: isSel ? 0.9 : 0.4 }); }
      else { const l = L.polyline(ll, { color: t.color, weight: isSel ? 4 : 2, opacity: isSel ? 0.9 : 0.4 }).addTo(this.map); this.mapLayers.tracks.set(t.id, l); }
    });

    // Event markers on map
    if (this.mapLayers.eventMarkers) {
      this.mapLayers.eventMarkers.forEach(m => this.map.removeLayer(m));
    }
    this.mapLayers.eventMarkers = [];

    (this.customEvents || []).forEach(evt => {
      if (evt.lat && evt.lon) {
        const symbol = evt.type === 'SPRINT' ? '⚡' : (evt.type === 'BUOY_TURN' ? '🔄' : (evt.type === 'MAX_SPEED' ? '🚀' : '⭐'));
        const iconHtml = `<div style="background:${evt.color || '#F59E0B'}; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#000; font-size:10px; font-weight:bold; box-shadow:0 0 10px ${evt.color || '#F59E0B'}; border:2px solid #fff;">${symbol}</div>`;
        const customIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [20, 20], iconAnchor: [10, 10] });
        const marker = L.marker([evt.lat, evt.lon], { icon: customIcon }).addTo(this.map);
        marker.bindPopup(`<b>${evt.name || evt.type}</b><br><span style="color:#00F2FE;">${evt.typeLabel || evt.type}</span>: ${evt.details || ''}`);
        this.mapLayers.eventMarkers.push(marker);
      }
    });

    const all = []; this.tracks.filter(t => t.visible).forEach(t => t.points.forEach(p => all.push([p.lat, p.lon])));
    if (all.length) this.map.fitBounds(all, { padding: [20, 20] });
  }

  _updateMapHighlight() {
    this._clearHighlight();
    if (!this.map) return;
    const t = this.getActiveTrack(); if (!t) return;
    const s = this.getNeedleIdx('start'), e = this.getNeedleIdx('end');
    const slice = t.points.slice(s, e + 1);
    if (slice.length >= 2) {
      this.mapLayers.selectionHighlight = L.polyline(slice.map(p => [p.lat, p.lon]), { color: '#fff', weight: 5, opacity: 0.8, dashArray: '6 6' }).addTo(this.map);
    }
  }

  _clearHighlight() {
    if (this.mapLayers.selectionHighlight && this.map) { this.map.removeLayer(this.mapLayers.selectionHighlight); this.mapLayers.selectionHighlight = null; }
  }

  // ---- Normalize ----
  _normalize(pts) {
    if (!pts || !pts.length) return [];
    const t0 = Number(pts[0].t ?? pts[0].timestamp ?? 0);
    const tEnd = Number(pts[pts.length - 1].t ?? pts[pts.length - 1].timestamp ?? 0);
    const isMs = (tEnd - t0) > 100000 || t0 > 1e9;
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      const lat = Number(p.lat ?? p.latitude);
      const lon = Number(p.lon ?? p.lng ?? p.longitude);
      const absT = Number(p.t ?? p.timestamp ?? 0);
      const t = isMs ? (absT - t0) : ((absT - t0) * 1000);
      let spd = p.spdKmh != null ? Number(p.spdKmh) : (p.speedKmh != null ? Number(p.speedKmh) : null);
      if ((spd == null || isNaN(spd) || (spd === 0 && i > 0)) && i > 0) {
        const prev = out[i - 1];
        const d = haversineM(prev.lat, prev.lon, lat, lon);
        const dtS = isMs ? (absT - prev.absT) / 1000 : (absT - prev.absT);
        spd = (dtS > 0 && dtS < 120) ? (d / dtS) * 3.6 : 0;
        if (spd > 55) spd = prev.spdKmh;
      }
      if (spd == null) spd = 0;
      const hr = p.hr != null ? Number(p.hr) : (p.heartRate != null ? Number(p.heartRate) : null);
      const ele = p.ele != null ? Number(p.ele) : (p.altitude != null ? Number(p.altitude) : null);
      out.push({ lat, lon, t: absT, absT, spdKmh: Number(Number(spd).toFixed(2)), hr, ele });
    }
    // Light smoothing (3-pt)
    for (let i = 1; i < out.length - 1; i++) {
      out[i].spdKmh = Number(((out[i-1].spdKmh * 0.25) + (out[i].spdKmh * 0.5) + (out[i+1].spdKmh * 0.25)).toFixed(2));
    }
    // Headings
    for (let j = 0; j < out.length; j++) {
      const la = out[Math.min(j + 3, out.length - 1)];
      const d = haversineM(out[j].lat, out[j].lon, la.lat, la.lon);
      out[j].heading = d >= 0.2 ? bearingDeg(out[j].lat, out[j].lon, la.lat, la.lon) : (j > 0 ? out[j-1].heading : 0);
    }
    return out;
  }
}

// ==========================================
// GPX PARSER
// ==========================================

function parseGPXText(xml) {
  const pts = [];
  const re = /<(?:trkpt|wpt|rtept)\s+([^>]+)>([\s\S]*?)<\/(?:trkpt|wpt|rtept)>/gi;
  let m, tc = Date.now();
  while ((m = re.exec(xml)) !== null) {
    const latM = /lat=["']([^"']+)["']/i.exec(m[1]);
    const lonM = /(?:lon|lng)=["']([^"']+)["']/i.exec(m[1]);
    if (!latM || !lonM) continue;
    const lat = parseFloat(latM[1]), lon = parseFloat(lonM[1]);
    const body = m[2];
    const eleM = /<ele>([^<]+)<\/ele>/i.exec(body);
    const timeM = /<time>([^<]+)<\/time>/i.exec(body);
    const hrM = /<(?:[a-zA-Z0-9_-]+:)?hr>([^<]+)<\/(?:[a-zA-Z0-9_-]+:)?hr>/i.exec(body);
    const spdM = /<(?:[a-zA-Z0-9_-]+:)?speed>([^<]+)<\/(?:[a-zA-Z0-9_-]+:)?speed>/i.exec(body);
    let ts = timeM ? new Date(timeM[1].trim()).getTime() : null;
    if (ts == null || isNaN(ts)) { ts = tc; tc += 1000; }
    if (!isNaN(lat) && !isNaN(lon)) {
      pts.push({ lat, lon, ele: eleM ? parseFloat(eleM[1]) : 0, t: ts, hr: hrM ? parseInt(hrM[1]) : null, spdKmh: spdM ? parseFloat(spdM[1]) * 3.6 : undefined });
    }
  }
  return pts;
}

function fmtS(sec) { if (!sec || isNaN(sec)) return '00:00'; const m = Math.floor(sec / 60), s = Math.round(sec % 60); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }

function toast(msg, type = 'info') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  const bc = type === 'success' ? '#10B981' : type === 'error' ? '#EF4444' : '#00F2FE';
  t.style.cssText = `background:rgba(13,19,31,0.95); border:1px solid ${bc}; color:#F8FAFC; padding:8px 14px; border-radius:8px; font-family:'Rajdhani',sans-serif; font-size:0.85rem; font-weight:700; box-shadow:0 8px 24px rgba(0,0,0,0.6); transition:all 0.3s; opacity:0; transform:translateY(10px); pointer-events:auto;`;
  t.textContent = msg;
  c.appendChild(t);
  requestAnimationFrame(() => { t.style.opacity = '1'; t.style.transform = 'translateY(0)'; });
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
}

// Needle Plugin for Chart.js
const needlePlugin = {
  id: 'needlePlugin',
  afterDraw(chart) {
    if (!studio.tracks.length) return;
    const { ctx, chartArea } = chart;
    const { top, bottom, left, right } = chartArea;
    const w = right - left;
    const zoom = studio.chartZoom;

    const drawNeedle = (frac, color, label) => {
      // Map frac to visible area considering zoom
      const visFrac = (frac - zoom.minFrac) / (zoom.maxFrac - zoom.minFrac);
      if (visFrac < 0 || visFrac > 1) return;
      const x = left + visFrac * w;

      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(x, top);
      ctx.lineTo(x, bottom);
      ctx.stroke();

      // Handle triangle
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x - 6, top);
      ctx.lineTo(x + 6, top);
      ctx.lineTo(x, top + 12);
      ctx.closePath();
      ctx.fill();

      // Label
      ctx.fillStyle = color;
      ctx.font = '600 10px JetBrains Mono';
      ctx.textAlign = 'center';
      ctx.fillText(label, x, top - 4);
      ctx.restore();
    };

    // Selection area fill
    const sf = (studio.needles.start.frac - zoom.minFrac) / (zoom.maxFrac - zoom.minFrac);
    const ef = (studio.needles.end.frac - zoom.minFrac) / (zoom.maxFrac - zoom.minFrac);
    const sx = left + Math.max(0, sf) * w;
    const ex = left + Math.min(1, ef) * w;
    if (ex > sx) {
      ctx.save();
      ctx.fillStyle = 'rgba(0, 242, 254, 0.08)';
      ctx.fillRect(sx, top, ex - sx, bottom - top);
      ctx.restore();
    }

    // Threshold line
    if (studio.thresholdLine && studio.visibleDimensions.includes('speed')) {
      const yAxis = chart.scales.y;
      if (yAxis) {
        const yPx = yAxis.getPixelForValue(studio.thresholdLine);
        if (yPx >= top && yPx <= bottom) {
          ctx.save();
          ctx.strokeStyle = '#8B5CF6';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([6, 4]);
          ctx.beginPath();
          ctx.moveTo(left, yPx);
          ctx.lineTo(right, yPx);
          ctx.stroke();
          ctx.fillStyle = 'rgba(139, 92, 246, 0.08)';
          ctx.fillRect(left, yPx, w, bottom - yPx);
          ctx.font = '600 10px JetBrains Mono';
          ctx.fillStyle = '#8B5CF6';
          ctx.textAlign = 'left';
          ctx.fillText(`${studio.thresholdLine} km/h`, left + 4, yPx - 4);
          ctx.restore();
        }
      }
    }

    // Event markers on chart
    if (studio.customEvents && studio.customEvents.length > 0) {
      const activeT = studio.getActiveTrack();
      const refTrack = activeT || studio.tracks[0];
      if (refTrack && refTrack.points.length > 1) {
        const pts = refTrack.points;
        const t0 = pts[0].t;
        const tEnd = pts[pts.length - 1].t;
        const isMs = (tEnd - t0) > 100000;
        const totalDurS = isMs ? (tEnd - t0) / 1000 : (tEnd - t0);
        const totalDistM = refTrack.summary?.distanceM || 1;

        // Filter events for active track or visible tracks
        const eventsToShow = studio.customEvents.filter(e => {
          if (!activeT) return true;
          return e.trackId === activeT.id || e.trackName === activeT.name || e.type === 'MAX_SPEED';
        }).slice(0, 16);

        eventsToShow.forEach((evt, eIdx) => {
          let frac = 0;
          if (studio.xAxisMode === 'distance') {
            frac = (evt.distanceMeters || 0) / totalDistM;
          } else {
            const evtS = isMs ? ((evt.t - t0) / 1000) : (evt.t - t0);
            frac = evtS / (totalDurS || 1);
          }

          const visFrac = (frac - zoom.minFrac) / (zoom.maxFrac - zoom.minFrac);
          if (visFrac < 0 || visFrac > 1) return;

          const x = left + visFrac * w;
          const color = evt.color || '#F59E0B';

          ctx.save();
          // Vertical event line
          ctx.strokeStyle = color;
          ctx.lineWidth = 1.5;
          ctx.setLineDash([3, 3]);
          ctx.beginPath();
          ctx.moveTo(x, top + 24);
          ctx.lineTo(x, bottom);
          ctx.stroke();

          // Event Badge Pin
          const iconSymbol = evt.type === 'SPRINT' ? '⚡' : (evt.type === 'BUOY_TURN' ? '🔄' : (evt.type === 'MAX_SPEED' ? '🚀' : '⭐'));
          const labelText = `${iconSymbol} ${evt.name || evt.type} ${evt.details ? '(' + evt.details + ')' : ''}`;

          ctx.font = '700 9px JetBrains Mono';
          const txtW = ctx.measureText(labelText).width;
          const bW = txtW + 12;
          const bH = 16;
          const bY = top + 2 + (eIdx % 2) * 18;

          ctx.fillStyle = 'rgba(13, 19, 31, 0.94)';
          ctx.strokeStyle = color;
          ctx.lineWidth = 1.2;
          ctx.setLineDash([]);
          ctx.beginPath();
          ctx.roundRect(x - bW / 2, bY, bW, bH, 4);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = color;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(labelText, x, bY + bH / 2);

          // Dot at bottom
          ctx.beginPath();
          ctx.arc(x, bottom - 3, 3, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        });
      }
    }

    const si = studio.getNeedleInfo('start');
    const ei = studio.getNeedleInfo('end');
    drawNeedle(studio.needles.start.frac, '#10B981', si ? (studio.xAxisMode === 'time' ? fmtS(si.relS) : `${si.distKm}km`) : '');
    drawNeedle(studio.needles.end.frac, '#EF4444', ei ? (studio.xAxisMode === 'time' ? fmtS(ei.relS) : `${ei.distKm}km`) : '');
  }
};
