function initChart() {
  const ctx = document.getElementById('main-chart').getContext('2d');
  mainChart = new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets: [] },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 0 },
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#94A3B8', font: { family: 'JetBrains Mono', size: 10 }, maxTicksLimit: 20 } },
        y: { position: 'left', grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#00F2FE', font: { family: 'JetBrains Mono', size: 10 } } }
      },
      plugins: {
        legend: { display: true, labels: { color: '#E2E8F0', font: { family: 'Rajdhani', size: 11, weight: 'bold' }, boxWidth: 12 } },
        tooltip: {
          backgroundColor: 'rgba(13,19,31,0.95)',
          titleFont: { family: 'Rajdhani', size: 12, weight: '800' },
          bodyFont: { family: 'JetBrains Mono', size: 11 },
          borderColor: 'rgba(0,242,254,0.3)',
          borderWidth: 1,
          padding: 8,
          callbacks: {
            title: function(context) {
              if (!context || !context.length) return '';
              const xVal = context[0].label;
              const unit = studio.xAxisMode === 'time' ? 'Tempo' : 'Distância';
              return `${unit}: ${xVal} ${studio.xAxisMode === 'distance' ? 'km' : ''}`;
            },
            label: function(context) {
              const ds = context.dataset;
              const idx = context.dataIndex;
              const pt = ds.trackPoints ? ds.trackPoints[idx] : null;
              const val = context.parsed.y != null ? context.parsed.y.toFixed(1) : '0.0';

              let timeStr = '--:--:--';
              if (pt) {
                let ts = pt.absT != null ? pt.absT : pt.t;
                if (ts != null) {
                  if (ts < 1e11) ts = ts * 1000;
                  const d = new Date(ts);
                  if (!isNaN(d.getTime())) {
                    const hh = String(d.getUTCHours()).padStart(2, '0');
                    const mm = String(d.getUTCMinutes()).padStart(2, '0');
                    const ss = String(d.getUTCSeconds()).padStart(2, '0');
                    timeStr = `${hh}:${mm}:${ss}`;
                  }
                }
              }

              const trackName = ds.trackName || ds.label;
              if (ds.dimKey === 'splitSpd' || ds.dimKey === 'splits') {
                const segId = pt && pt.splitSeg ? ` [${pt.splitSeg}]` : '';
                const pace = pt && pt.splitPace && pt.splitPace !== '--' ? ` (${pt.splitPace}/km)` : '';
                return ` ${trackName} - Split: ${val} km/h${pace}${segId} - ${timeStr}`;
              } else if (ds.dimKey === 'spdKmh' || !ds.dimKey) {
                return ` ${trackName} - ${val} km/h - ${timeStr}`;
              } else if (ds.dimKey === 'hr') {
                return ` ${trackName} - ${Math.round(context.parsed.y)} bpm - ${timeStr}`;
              } else if (ds.dimKey === 'ele') {
                return ` ${trackName} - ${val} m - ${timeStr}`;
              } else if (ds.dimKey === 'heading') {
                return ` ${trackName} - ${Math.round(context.parsed.y)}° - ${timeStr}`;
              } else {
                return ` ${trackName} - ${val} - ${timeStr}`;
              }
            }
          }
        }
      }
    }
  });
}

function updateChart() {
  if (!mainChart) return;
  const dims = studio.visibleDimensions;
  const visibleTracks = studio.tracks.filter(t => t.visible);
  if (!visibleTracks.length) { mainChart.data.labels = []; mainChart.data.datasets = []; mainChart.update(); return; }

  const activeT = studio.getActiveTrack();
  const refTrack = activeT || visibleTracks[0];
  const pts = refTrack.points;
  const zoom = studio.chartZoom;

  // Build labels for X axis
  let allLabels = [];
  if (studio.xAxisMode === 'distance') {
    let acc = 0;
    allLabels = pts.map((p, i) => { if (i > 0) acc += haversineM(pts[i-1].lat, pts[i-1].lon, p.lat, p.lon); return (acc / 1000).toFixed(2); });
  } else {
    const t0 = pts[0].t, isMs = pts.length > 1 && (pts[pts.length-1].t - t0) > 100000;
    allLabels = pts.map(p => { const s = isMs ? (p.t - t0) / 1000 : (p.t - t0); return fmtS(Math.round(s)); });
  }

  // Apply zoom
  const sIdx = Math.floor(zoom.minFrac * (pts.length - 1));
  const eIdx = Math.ceil(zoom.maxFrac * (pts.length - 1));
  const labels = allLabels.slice(sIdx, eIdx + 1);

  // Build datasets
  const datasets = [];
  const hasDualAxis = dims.filter(d => d !== 'speed' && d !== 'splits').length > 0 && dims.some(d => d === 'speed' || d === 'splits');

  visibleTracks.forEach(t => {
    let tPts = t.points;
    const tSIdx = Math.floor(zoom.minFrac * (tPts.length - 1));
    const tEIdx = Math.ceil(zoom.maxFrac * (tPts.length - 1));
    const sliced = tPts.slice(tSIdx, tEIdx + 1);
    const isActive = t.id === (activeT?.id);

    dims.forEach((dim, dIdx) => {
      const cfg = DIM_CONFIG[dim];
      if (!cfg) return;
      if (dim === 'splits') {
        ensureTrackPointSplits(t, studio.splitIntervalM);
      }
      const isSplit = dim === 'splits';
      datasets.push({
        label: isSplit ? `${t.name} — Splits (${studio.splitIntervalM}m)` : `${t.name} — ${cfg.label}`,
        trackName: t.name,
        trackPoints: sliced,
        dimKey: cfg.key,
        dimLabel: cfg.label,
        data: sliced.map(p => p[cfg.key] != null ? p[cfg.key] : null),
        borderColor: isSplit ? '#F59E0B' : (dIdx === 0 ? t.color : cfg.color),
        backgroundColor: isSplit ? 'rgba(245, 158, 11, 0.14)' : ((dIdx === 0 ? t.color : cfg.color) + '15'),
        stepped: isSplit ? 'before' : false,
        borderDash: isSplit ? [6, 3] : [],
        fill: dims.length === 1,
        tension: isSplit ? 0 : 0.2,
        borderWidth: isSplit ? (isActive ? 2.5 : 1.8) : (isActive ? 2.5 : 1.5),
        pointRadius: 0,
        yAxisID: (isSplit || cfg.yAxisID === 'y') ? 'y' : 'y1'
      });
    });
  });

  mainChart.data.labels = labels;
  mainChart.data.datasets = datasets;

  // Scale config
  const firstDim = DIM_CONFIG[dims[0]];
  mainChart.options.scales.y = {
    position: 'left',
    title: { display: true, text: (dims.includes('speed') || dims.includes('splits')) ? 'Velocidade / Splits (km/h)' : (firstDim?.label || ''), color: '#00F2FE' },
    grid: { color: 'rgba(255,255,255,0.04)' },
    ticks: { color: '#00F2FE', font: { family: 'JetBrains Mono', size: 10 } }
  };

  const secondaryDims = dims.filter(d => d !== 'speed' && d !== 'splits');
  if (secondaryDims.length > 0 && (dims.includes('speed') || dims.includes('splits'))) {
    const secDim = DIM_CONFIG[secondaryDims[0]];
    mainChart.options.scales.y1 = {
      position: 'right',
      title: { display: true, text: secDim?.label || '', color: secDim?.color || '#fff' },
      grid: { drawOnChartArea: false },
      ticks: { color: secDim?.color || '#fff', font: { family: 'JetBrains Mono', size: 10 } }
    };
  } else {
    delete mainChart.options.scales.y1;
  }

  mainChart.update();
}

function updateNeedleInfo() {
  const si = studio.getNeedleInfo('start');
  const ei = studio.getNeedleInfo('end');
  document.getElementById('ni-start').textContent = si ? (studio.xAxisMode === 'time' ? fmtS(si.relS) : `${si.distKm} km`) : '--';
  document.getElementById('ni-end').textContent = ei ? (studio.xAxisMode === 'time' ? fmtS(ei.relS) : `${ei.distKm} km`) : '--';
  if (si && ei) {
    const extM = ei.distM - si.distM;
    const extS = ei.relS - si.relS;
    document.getElementById('ni-extent').textContent = `${(extM/1000).toFixed(2)} km · ${fmtS(extS)}`;
  } else {
    document.getElementById('ni-extent').textContent = '--';
  }
}

function updateStats() {
  const t = studio.getActiveTrack(); if (!t) return;
  const s = t.summary;
  document.getElementById('st-dist').textContent = `${(s.distanceM / 1000).toFixed(2)} km`;
  document.getElementById('st-dur').textContent = fmtS(s.durationS);
  document.getElementById('st-spd-avg').textContent = `${s.speedAvgKmh || 0} km/h`;
  document.getElementById('st-spd-max').textContent = `${s.speedMaxKmh || 0} km/h`;
  document.getElementById('st-hr-avg').textContent = s.hrAvg ? `${s.hrAvg} bpm` : '--';
  document.getElementById('st-hr-max').textContent = s.hrMax ? `${s.hrMax} bpm` : '--';

  ensureTrackPointSplits(t, studio.splitIntervalM);

  const sc = document.getElementById('splits-container');
  if (t.segments && t.segments.length) {
    sc.innerHTML = `<table class="splits-table">
      <thead><tr><th>Segmento</th><th>Vel. Média</th><th>Pace</th><th>FC Média</th></tr></thead>
      <tbody>${
        t.segments.map(seg => `<tr>
          <td style="color:var(--cyan); font-weight:700;">${seg.segmentId}</td>
          <td style="font-weight:700; color:#fff;">${seg.speedAvgKmh} km/h</td>
          <td style="color:var(--gold); font-weight:700;">${seg.paceStr || '--'}</td>
          <td>${seg.hrAvg ? '❤️ ' + seg.hrAvg + ' bpm' : '--'}</td>
        </tr>`).join('')
      }</tbody>
    </table>`;
  } else {
    sc.innerHTML = `<div style="padding:10px; text-align:center; color:var(--text-muted); font-size:0.7rem;">Nenhum split disponível.</div>`;
  }
}

function renderTracks() {
  const c = document.getElementById('tracks-pills-container');
  c.innerHTML = '';
  studio.tracks.forEach((t, idx) => {
    const pill = document.createElement('div');
    pill.className = `track-pill ${idx === studio.activeTrackIdx ? 'active' : ''}`;
    pill.innerHTML = `
      <span class="track-dot" style="background:${t.color}; box-shadow:0 0 6px ${t.color};"></span>
      <span class="track-pill-name">${t.name}</span>
      <span class="track-pill-meta">${(t.summary.distanceM/1000).toFixed(1)}km · ${t.summary.speedAvgKmh||0}km/h</span>
      <select class="utc-select" data-idx="${idx}" title="UTC Offset">
        ${Array.from({length:27}, (_, i) => i - 12).map(v => `<option value="${v}" ${v === (t.utcOffsetH||0) ? 'selected' : ''}>UTC${v >= 0 ? '+' : ''}${v}</option>`).join('')}
      </select>
      <div class="track-pill-actions">
        <button class="btn-icon" data-action="toggle" data-idx="${idx}" title="${t.visible ? 'Ocultar' : 'Exibir'}"><i class="fa-solid ${t.visible ? 'fa-eye' : 'fa-eye-slash'}" style="color:${t.visible ? 'var(--cyan)' : 'var(--text-muted)'}"></i></button>
        <button class="btn-icon" data-action="remove" data-idx="${idx}" title="Remover"><i class="fa-solid fa-xmark"></i></button>
      </div>
    `;
    pill.addEventListener('click', (e) => {
      if (e.target.closest('.btn-icon') || e.target.closest('.utc-select')) return;
      studio.setActiveTrack(idx);
    });
    c.appendChild(pill);
  });

  // UTC select listeners
  c.querySelectorAll('.utc-select').forEach(sel => {
    sel.addEventListener('change', (e) => {
      e.stopPropagation();
      studio.applyUTCOffset(parseInt(sel.dataset.idx), parseInt(sel.value));
      toast(`✓ UTC offset alterado para ${sel.value}`, 'success');
    });
  });

  // Action button listeners
  c.querySelectorAll('.btn-icon').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.idx);
      if (btn.dataset.action === 'toggle') studio.toggleVisibility(idx);
      else if (btn.dataset.action === 'remove') studio.removeTrack(idx);
    });
  });
}

function renderEventsList() {
  const c = document.getElementById('events-list-container');
  const countEl = document.getElementById('pop-events-count');
  const btnCount = document.getElementById('lbl-events-count');
  if (!c) return;

  const evts = studio.customEvents || [];
  if (countEl) countEl.textContent = `${evts.length}`;
  if (btnCount) {
    btnCount.textContent = `${evts.length}`;
    btnCount.style.display = evts.length > 0 ? 'inline-block' : 'none';
  }

  if (!evts.length) {
    c.innerHTML = '<div style="padding:12px; text-align:center; color:var(--text-muted); font-size:0.75rem;">Nenhum evento detectado.<br>Clique em "Detectar" para analisar ataques, sprints e boias.</div>';
    return;
  }

  c.innerHTML = evts.map((evt, idx) => `
    <div style="display:flex; align-items:center; justify-content:space-between; padding:5px 8px; background:rgba(255,255,255,0.04); border-radius:4px; font-family:var(--font-mono); font-size:0.72rem; border-left:3px solid ${evt.color || 'var(--gold)'};">
      <div style="display:flex; align-items:center; gap:6px; overflow:hidden;">
        <span style="color:${evt.color || '#fff'}; font-weight:700;">${evt.type === 'SPRINT' ? '⚡' : (evt.type === 'BUOY_TURN' ? '🔄' : (evt.type === 'MAX_SPEED' ? '🚀' : '⭐'))}</span>
        <span style="color:#fff; font-weight:700; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${evt.name || evt.type}</span>
        <span style="color:var(--text-sec); font-size:0.65rem;">${evt.details || ''}</span>
      </div>
      <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
        <span style="color:var(--cyan); font-size:0.68rem; font-weight:700;">${fmtS(evt.timeSeconds || 0)}</span>
        <button class="btn-icon" data-action="zoom-evt" data-idx="${idx}" title="Centralizar agulha no evento" style="color:var(--gold);"><i class="fa-solid fa-crosshairs"></i></button>
        <button class="btn-icon" data-action="del-evt" data-idx="${idx}" title="Excluir evento"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
  `).join('');

  c.querySelectorAll('[data-action="zoom-evt"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.idx);
      const evt = evts[idx];
      if (evt) {
        const refTrack = studio.getActiveTrack() || studio.tracks[0];
        if (refTrack && refTrack.points.length) {
          const t0 = refTrack.points[0].t;
          const tEnd = refTrack.points[refTrack.points.length - 1].t;
          const isMs = (tEnd - t0) > 100000;
          const totalDurS = isMs ? (tEnd - t0) / 1000 : (tEnd - t0);
          const totalDistM = refTrack.summary?.distanceM || 1;
          const frac = studio.xAxisMode === 'distance'
            ? ((evt.distanceMeters || 0) / totalDistM)
            : (((isMs ? (evt.t - t0) / 1000 : (evt.t - t0))) / totalDurS);
          studio.setNeedle('start', Math.max(0, frac - 0.04));
          studio.setNeedle('end', Math.min(1, frac + 0.04));
          updateChart();
          updateNeedleInfo();
          toast(`🎯 Foco em: ${evt.name || evt.type}`, 'info');
        }
      }
    });
  });

  c.querySelectorAll('[data-action="del-evt"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.idx);
      studio.customEvents.splice(idx, 1);
      renderEventsList();
      studio._updateMap();
      updateChart();
      toast('Evento removido.', 'info');
    });
  });
}

function refreshAll() {
  renderTracks();
  updateChart();
  updateNeedleInfo();
  updateStats();
  renderEventsList();
}

// ---- Event Binding ----
function bindEvents() {
  // State changes
  studio.subscribe((type) => { refreshAll(); });

  // File upload
  document.getElementById('file-uploader').addEventListener('change', async (e) => {
    for (const file of Array.from(e.target.files)) { await processFile(file); }
    e.target.value = '';
  });

  // Drag & Drop
  window.addEventListener('dragover', e => { e.preventDefault(); });
  window.addEventListener('drop', async (e) => {
    e.preventDefault();
    if (e.dataTransfer?.files?.length) { for (const f of Array.from(e.dataTransfer.files)) { await processFile(f); } }
  });

  // Demo load
  document.getElementById('btn-load-demo').addEventListener('click', loadDemoGPX);

  // X axis toggle
  document.getElementById('x-axis-toggle').addEventListener('click', (e) => {
    const btn = e.target.closest('.toggle-btn');
    if (!btn) return;
    document.querySelectorAll('#x-axis-toggle .toggle-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    studio.xAxisMode = btn.dataset.mode;
    updateChart(); updateNeedleInfo();
  });

  // Dimension toggles
  document.querySelectorAll('.dim-check input').forEach(chk => {
    chk.addEventListener('change', () => {
      const dim = chk.dataset.dim;
      const checked = chk.checked;
      if (checked && !studio.visibleDimensions.includes(dim)) studio.visibleDimensions.push(dim);
      else if (!checked) studio.visibleDimensions = studio.visibleDimensions.filter(d => d !== dim);
      if (!studio.visibleDimensions.length) { studio.visibleDimensions = ['speed']; document.querySelector('.dim-check input[data-dim="speed"]').checked = true; }
      document.querySelectorAll('.dim-check').forEach(lbl => { lbl.classList.toggle('active', lbl.querySelector('input').checked); });
      updateChart();
    });
  });

  // Zoom buttons
  document.getElementById('btn-zoom-in').addEventListener('click', () => { studio.zoom(0.75); updateChart(); });
  document.getElementById('btn-zoom-out').addEventListener('click', () => { studio.zoom(1.33); updateChart(); });
  document.getElementById('btn-zoom-reset').addEventListener('click', () => { studio.resetZoom(); updateChart(); });

  // MouseWheel zoom on chart
  const chartEl = document.getElementById('chart-container');
  chartEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = chartEl.getBoundingClientRect();
    const cf = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    studio.zoom(e.deltaY < 0 ? 0.82 : 1.22, cf);
    updateChart();
  }, { passive: false });

  // Needle dragging on chart
  let draggingNeedle = null;
  let isPanning = false;
  let panStartX = 0;

  chartEl.addEventListener('mousedown', (e) => {
    if (!mainChart || !studio.tracks.length) return;
    const rect = chartEl.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const ca = mainChart.chartArea;
    if (!ca) return;
    const fracInChart = (x - ca.left) / (ca.right - ca.left);
    const fracInData = studio.chartZoom.minFrac + fracInChart * (studio.chartZoom.maxFrac - studio.chartZoom.minFrac);

    // Check if near a needle
    const startVisFrac = (studio.needles.start.frac - studio.chartZoom.minFrac) / (studio.chartZoom.maxFrac - studio.chartZoom.minFrac);
    const endVisFrac = (studio.needles.end.frac - studio.chartZoom.minFrac) / (studio.chartZoom.maxFrac - studio.chartZoom.minFrac);
    const threshold = 0.02;

    if (Math.abs(fracInChart - startVisFrac) < threshold) { draggingNeedle = 'start'; }
    else if (Math.abs(fracInChart - endVisFrac) < threshold) { draggingNeedle = 'end'; }
    else { isPanning = true; panStartX = e.clientX; }
  });

  window.addEventListener('mousemove', (e) => {
    if (draggingNeedle && mainChart) {
      const rect = chartEl.getBoundingClientRect();
      const ca = mainChart.chartArea;
      if (!ca) return;
      const fracInChart = Math.max(0, Math.min(1, (e.clientX - rect.left - ca.left) / (ca.right - ca.left)));
      const fracInData = studio.chartZoom.minFrac + fracInChart * (studio.chartZoom.maxFrac - studio.chartZoom.minFrac);
      studio.setNeedle(draggingNeedle, fracInData);
      updateChart(); updateNeedleInfo();
    } else if (isPanning) {
      const dx = e.clientX - panStartX;
      panStartX = e.clientX;
      const rect = chartEl.getBoundingClientRect();
      const frac = -dx / rect.width * (studio.chartZoom.maxFrac - studio.chartZoom.minFrac);
      studio.pan(frac);
      updateChart();
    }
  });

  window.addEventListener('mouseup', () => { draggingNeedle = null; isPanning = false; });

  // Action buttons
  document.getElementById('btn-trim-needles').addEventListener('click', () => { studio.trimToNeedles(); toast('✓ Trilha cortada entre agulhas.', 'success'); });
  document.getElementById('btn-remove-needles').addEventListener('click', () => { studio.removeInterval(); toast('✓ Intervalo excluído.', 'success'); });
  document.getElementById('btn-extract-series').addEventListener('click', () => { studio.extractSeries(); toast('✓ Nova série extraída.', 'success'); });
  document.getElementById('btn-set-start').addEventListener('click', () => { studio.setStartAtNeedle(true); toast('🏁 Largada definida.', 'success'); });
  document.getElementById('btn-set-finish').addEventListener('click', () => { studio.setFinishAtNeedle(true); toast('🏆 Chegada definida.', 'success'); });
  document.getElementById('btn-apply-duration').addEventListener('click', () => {
    const v = document.getElementById('input-duration').value.trim();
    if (!v) return toast('Digite duração no formato MM:SS ou HH:MM:SS', 'error');
    studio.setFinishByDuration(v);
    toast(`✓ Agulha de chegada posicionada em +${v}`, 'success');
  });
  document.getElementById('btn-undo').addEventListener('click', () => { studio.undo(); toast('↩ Desfeito.', 'info'); });
  document.getElementById('btn-reset').addEventListener('click', () => { studio.resetTrack(); toast('🔄 Trilha restaurada.', 'info'); });

  // Smooth popover
  document.getElementById('btn-smooth').addEventListener('click', () => { togglePop('pop-smooth'); });
  document.getElementById('range-smooth').addEventListener('input', (e) => { document.getElementById('val-smooth').textContent = `${e.target.value} pts`; });
  document.querySelectorAll('#pop-smooth [data-sw]').forEach(b => { b.addEventListener('click', () => { document.getElementById('range-smooth').value = b.dataset.sw; document.getElementById('val-smooth').textContent = `${b.dataset.sw} pts`; }); });
  document.getElementById('btn-apply-smooth').addEventListener('click', () => {
    const ws = parseInt(document.getElementById('range-smooth').value);
    studio.applySmoothing(ws, document.getElementById('chk-smooth-hr').checked, document.getElementById('chk-smooth-all').checked);
    document.getElementById('pop-smooth').classList.remove('show');
    toast(`✓ Suavização ${ws}pts aplicada.`, 'success');
  });

  // Threshold popover
  document.getElementById('btn-threshold').addEventListener('click', () => { togglePop('pop-threshold'); });
  document.getElementById('range-thresh-spd').addEventListener('input', (e) => {
    document.getElementById('val-thresh-spd').textContent = `${e.target.value} km/h`;
    studio.thresholdLine = parseFloat(e.target.value);
    updateChart();
  });
  document.getElementById('btn-apply-threshold').addEventListener('click', () => {
    const v = parseFloat(document.getElementById('range-thresh-spd').value);
    studio.filterByThreshold(v);
    studio.thresholdLine = null;
    document.getElementById('pop-threshold').classList.remove('show');
    toast(`✓ Pontos < ${v} km/h removidos.`, 'success');
  });

  // Auto events popover & actions
  document.getElementById('btn-auto-events').addEventListener('click', () => {
    if (!studio.customEvents.length && studio.tracks.length) {
      studio.autoDetectEvents();
    }
    renderEventsList();
    togglePop('pop-events');
  });

  document.getElementById('btn-re-detect-events').addEventListener('click', () => {
    if (!studio.tracks.length) return toast('Carregue pelo menos uma trilha primeiro.', 'error');
    const evts = studio.autoDetectEvents();
    renderEventsList();
    updateChart();
    toast(`⚡ ${evts.length} eventos detectados e destacados no gráfico!`, 'success');
  });

  document.getElementById('btn-pop-export-events').addEventListener('click', () => {
    const jsonStr = studio.exportEventsJSON();
    if (!jsonStr) return toast('Nenhum evento detectado para exportar.', 'error');
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `eventos-vaarec-${Date.now()}.json`; a.click();
    toast('⚡ Arquivo JSON de Eventos exportado!', 'success');
  });

  document.getElementById('btn-export-events').addEventListener('click', () => {
    const jsonStr = studio.exportEventsJSON();
    if (!jsonStr) return toast('Nenhum evento detectado para exportar.', 'error');
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `eventos-vaarec-${Date.now()}.json`; a.click();
    toast('⚡ Arquivo JSON de Eventos exportado!', 'success');
  });

  document.getElementById('btn-clear-events').addEventListener('click', () => {
    studio.customEvents = [];
    renderEventsList();
    studio._updateMap();
    updateChart();
    toast('Eventos limpos.', 'info');
  });

  // Auto series popover
  document.getElementById('btn-auto-series').addEventListener('click', () => { togglePop('pop-series'); });
  document.getElementById('sel-series-mode').addEventListener('change', (e) => {
    document.getElementById('grp-series-spd').style.display = e.target.value === 'speed' ? 'flex' : 'none';
    document.getElementById('grp-series-dist').style.display = e.target.value === 'distance' ? 'flex' : 'none';
    document.getElementById('grp-series-time').style.display = e.target.value === 'time' ? 'flex' : 'none';
  });
  document.getElementById('range-series-spd').addEventListener('input', (e) => { document.getElementById('val-series-spd').textContent = `${e.target.value} km/h`; });
  document.getElementById('btn-apply-series').addEventListener('click', () => {
    const mode = document.getElementById('sel-series-mode').value;
    const cfg = { mode };
    if (mode === 'speed') cfg.minSpeedKmh = parseFloat(document.getElementById('range-series-spd').value);
    else if (mode === 'distance') cfg.intervalM = parseInt(document.getElementById('input-series-dist').value);
    else if (mode === 'time') cfg.intervalS = parseInt(document.getElementById('input-series-time').value);
    const s = studio.autoSeries(cfg);
    document.getElementById('pop-series').classList.remove('show');
    toast(`✓ ${s.length} séries detectadas.`, 'success');
  });

  // Split interval
  document.getElementById('sel-split').addEventListener('change', (e) => {
    studio.splitIntervalM = parseInt(e.target.value);
    document.getElementById('lbl-split-int').textContent = `${e.target.value}m`;
    studio.tracks.forEach(t => { ensureTrackPointSplits(t, studio.splitIntervalM); });
    updateStats();
    updateChart();
  });

  // Auto Align UTC
  document.getElementById('btn-auto-align-utc').addEventListener('click', () => {
    if (studio.tracks.length < 2) return toast('Carregue pelo menos 2 trilhas para alinhar.', 'error');
    studio.alignAllTrackStartTimes();
    toast('✓ Horários de largada alinhados automaticamente!', 'success');
  });

  // Export
  document.getElementById('btn-export-contract').addEventListener('click', () => {
    const c = studio.generateContract();
    const blob = new Blob([JSON.stringify(c, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `contrato-studio-${Date.now()}.json`; a.click();
    toast('✅ Contrato JSON exportado!', 'success');
  });

  document.getElementById('btn-export-gpx').addEventListener('click', () => {
    const gpx = studio.exportGPX();
    if (!gpx) return toast('Nenhuma trilha ativa.', 'error');
    const blob = new Blob([gpx], { type: 'application/gpx+xml' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `track-${Date.now()}.gpx`; a.click();
    toast('✅ GPX exportado!', 'success');
  });

  document.getElementById('btn-send-to-generator').addEventListener('click', () => {
    if (!studio.tracks.length) return toast('Nenhuma trilha carregada para enviar.', 'error');
    const c = studio.generateContract();
    localStorage.setItem('vaarec_contract', JSON.stringify(c));
    toast('🚀 Contrato salvo! Redirecionando para o Gerador...', 'success');
    setTimeout(() => { window.location.href = '/'; }, 1000);
  });

  // Keyboard
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
    if (e.key === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); studio.undo(); }
  });
}

function togglePop(id) {
  const el = document.getElementById(id);
  document.querySelectorAll('.popover').forEach(p => { if (p.id !== id) p.classList.remove('show'); });
  el.classList.toggle('show');
}

// ---- File processing ----
async function processFile(file) {
  try {
    const text = await file.text();
    const name = file.name.replace(/\.[^/.]+$/, '');
    const lower = file.name.toLowerCase();

    if (lower.endsWith('.gpx') || text.includes('<gpx') || text.includes('<trkpt')) {
      const pts = parseGPXText(text);
      if (pts.length < 2) { toast(`⚠️ "${file.name}" sem pontos válidos.`, 'error'); return; }
      studio.addTrack(name, pts, null, file.name);
      toast(`✓ "${name}" carregada (${pts.length} pts).`, 'success');
    } else if (lower.endsWith('.json') || lower.endsWith('.txt') || text.trim().startsWith('{')) {
      const json = JSON.parse(text);
      if (json.type === 'VAAREC_EVENTS' || (Array.isArray(json.events) && json.events.length) || (Array.isArray(json) && json[0]?.type)) {
        const evts = Array.isArray(json.events) ? json.events : (Array.isArray(json) ? json : (json.all || []));
        studio.customEvents = evts;
        renderEventsList();
        studio._updateMap();
        updateChart();
        toast(`⚡ ${evts.length} eventos carregados do arquivo JSON!`, 'success');
        return;
      }
      if (json.sportPackage?.tracks) {
        json.sportPackage.tracks.forEach(t => studio.addTrack(t.name || name, t.points || t.data, t.color, file.name));
        toast(`✓ Contrato "${json.name || name}" carregado.`, 'success');
      } else if (Array.isArray(json)) {
        studio.addTrack(name, json, null, file.name);
        toast(`✓ "${name}" carregada.`, 'success');
      } else if (json.points || json.records || json.track) {
        studio.addTrack(name, json.points || json.records || json.track, null, file.name);
        toast(`✓ "${name}" carregada.`, 'success');
      } else if (json.activityDetailMetrics) {
        // Garmin JSON
        const desc = json.metricDescriptors || [];
        const metrics = json.activityDetailMetrics || [];
        let lI = desc.findIndex(d => d.key === 'directLatitude'); if (lI === -1) lI = 0;
        let lnI = desc.findIndex(d => d.key === 'directLongitude'); if (lnI === -1) lnI = 1;
        let tI = desc.findIndex(d => d.key === 'directTimestamp'); if (tI === -1) tI = 3;
        let hI = desc.findIndex(d => d.key === 'directHeartRate'); if (hI === -1) hI = 4;
        let sI = desc.findIndex(d => d.key === 'directSpeed'); if (sI === -1) sI = 9;
        const pts = [];
        metrics.forEach(item => {
          const m = item.metrics;
          if (m && m.length > Math.max(lI, lnI)) {
            const lat = m[lI], lon = m[lnI]; let t = m[tI]; if (t && t < 1e11) t *= 1000;
            if (lat && lon && !isNaN(lat)) pts.push({ lat, lon, t: t || Date.now(), hr: m[hI] ? Math.round(m[hI]) : null, spdKmh: m[sI] ? m[sI] * 3.6 : undefined });
          }
        });
        if (pts.length >= 2) { studio.addTrack(name, pts, null, file.name); toast(`✓ Garmin "${name}" carregada.`, 'success'); }
      }
    }
  } catch (err) { console.error(err); toast(`⚠️ Erro: ${err.message}`, 'error'); }
}

// ---- Demo: Load real GPX from GPS/V1-Zimbros-Masc ----
async function loadDemoGPX() {
  studio.tracks = [];
  studio.customEvents = [];
  if (studio.mapLayers.tracks) studio.mapLayers.tracks.clear();
  if (studio.mapLayers.eventMarkers) {
    studio.mapLayers.eventMarkers.forEach(m => studio.map?.removeLayer(m));
    studio.mapLayers.eventMarkers = [];
  }
  const files = ['Deividy.gpx', 'Guga.gpx', 'Jean.gpx', 'Luiz.gpx', 'Noe.gpx', 'Valter.gpx', 'Will.gpx'];
  const paths = ['./GPS/V1-Zimbros-Masc/', 'GPS/V1-Zimbros-Masc/', '../GPS/V1-Zimbros-Masc/', '/GPS/V1-Zimbros-Masc/'];
  let loaded = 0;

  for (const f of files) {
    let text = null;
    for (const base of paths) {
      try {
        const res = await fetch(base + f);
        if (res.ok) { text = await res.text(); if (text && text.length > 50) break; text = null; }
      } catch(e) {}
    }
    if (text) {
      const pts = parseGPXText(text);
      if (pts.length >= 2) { studio.addTrack(f.replace('.gpx', ''), pts, null, f); loaded++; }
    }
  }

  if (loaded > 0) toast(`✓ ${loaded} trilhas de V1-Zimbros carregadas.`, 'success');
  else toast('⚠️ Não foi possível carregar os GPX de demo. Verifique a pasta GPS/V1-Zimbros-Masc/.', 'error');
}
