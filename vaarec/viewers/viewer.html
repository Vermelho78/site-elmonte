<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>VAAREC Viewer — Replay Multi-GPS OC6</title>
  <meta name="description"
    content="Visualizador de replay GPS para canoas OC6. HUD de telemetria, câmera drone e splits km×km.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/drone-camera-skills.js"></script>

  <style>
    /* ================================================================ DESIGN SYSTEM */
    :root {
      --bg: #030712;
      --bg-card: #0d1520;
      --bg-panel: #0f172a;
      --bg-hover: #1e293b;
      --border: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(6, 182, 212, 0.3);
      --accent: #06b6d4;
      --accent-dim: rgba(6, 182, 212, 0.15);
      --gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.35);
      --start: #10b981;
      --end: #ef4444;
      --text: #f8fafc;
      --text-sec: #94a3b8;
      --text-muted: #64748b;
      --font-hud: 'Rajdhani', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --nav-h: 52px;
      --header-h: 46px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      overflow: hidden;
    }

    /* ================================================================ LAYOUT */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      max-height: 100dvh;
      width: 100vw;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      padding-bottom: var(--nav-h);
    }

    #app-header {
      height: var(--header-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: linear-gradient(90deg, #0a1628 0%, var(--bg-card) 100%);
      border-bottom: 1px solid var(--border);
      gap: 8px;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      min-width: 0;
      flex: 1;
    }

    .header-badge {
      font-family: var(--font-hud);
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid var(--border-glow);
      padding: 2px 8px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    #app-header h1 {
      font-family: var(--font-hud);
      font-size: 0.95rem;
      font-weight: 700;
      background: linear-gradient(90deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-sub {
      font-size: 0.65rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--text-sec);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ================================================================ CONTENT AREA */
    #content-area {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .mobile-tab {
      display: none !important;
      width: 100%;
      height: 100%;
    }

    .mobile-tab.active {
      display: block !important;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    #view-map.active {
      display: flex !important;
      flex-direction: column;
      overflow: hidden;
    }

    /* ================================================================ MAP TAB */
    #map-area {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    #map-detail {
      width: 100%;
      height: 100%;
      background: #070a13;
    }

    .leaflet-container {
      background: #070a13;
    }

    /* Floating Drone Camera Director Widget */
    #drone-camera-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(12, 19, 32, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(6, 182, 212, 0.35);
      border-radius: 10px;
      padding: 6px 10px;
      font-family: var(--font-hud);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .drone-bar-title {
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .drone-btns {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
    }

    .drone-btn {
      font-family: var(--font-hud);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .drone-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .drone-btn.active {
      border-color: var(--accent);
      color: #000;
      background: var(--accent);
      font-weight: 800;
      box-shadow: 0 0 10px var(--border-glow);
    }

    .drone-btn-mini {
      font-family: var(--font-hud);
      font-size: 0.62rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .drone-btn-mini:hover {
      border-color: var(--accent);
      color: #fff;
      background: var(--accent-dim);
    }

    .drone-btn-mini.active {
      border-color: var(--accent);
      color: #000;
      background: var(--accent);
      font-weight: 800;
    }

    /* Floating Heart Rate (FC) Zone Legend */
    #hr-legend {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(12, 19, 32, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 4px 8px;
      font-family: var(--font-hud);
      pointer-events: none;
    }

    .hr-legend-title {
      font-size: 0.58rem;
      font-weight: 700;
      color: var(--text-sec);
      margin-bottom: 3px;
      text-transform: uppercase;
    }

    .hr-legend-bars {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .hr-item {
      font-size: 0.62rem;
      font-weight: 700;
      color: #f0f9ff;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .hr-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }

    /* ================================================================ COMPACT CONTROLS BAR */
    #controls-bar {
      width: 100%;
      flex-shrink: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 100;
    }

    #main-player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .player-left-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #btn-play {
      width: 38px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    #btn-play:hover {
      background: rgba(6, 182, 212, 0.3);
      box-shadow: 0 0 12px var(--border-glow);
    }

    #btn-speed-toggle {
      font-family: var(--font-hud);
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #btn-speed-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    #time-indicator-pill {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(0, 0, 0, 0.35);
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    #btn-toggle-metrics {
      font-family: var(--font-hud);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-sec);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    #btn-toggle-metrics:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Collapsible Metrics & Timeline Container */
    #collapsible-metrics {
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.25s ease-in-out;
      overflow: hidden;
    }

    #collapsible-metrics.collapsed {
      display: none;
    }

    #timeline-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-display {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-sec);
      white-space: nowrap;
    }

    #timeline-track {
      flex: 1;
      height: 18px;
      display: flex;
      align-items: center;
      cursor: pointer;
      position: relative;
    }

    #timeline-bg {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      left: 0;
      right: 0;
      height: 4px;
      background: var(--bg-hover);
      border-radius: 2px;
    }

    #timeline-fill {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), #38bdf8);
      border-radius: 2px;
      width: 0%;
      pointer-events: none;
    }

    #timeline-handle {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      background: #fff;
      border: 2px solid var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
      pointer-events: none;
      left: 0%;
    }

    #dist-row {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-hud);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-sec);
      padding: 0 2px;
      overflow-x: auto;
    }

    /* Eventos Notáveis Bar */
    #events-card-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 10px;
      background: rgba(10, 15, 26, 0.95);
      border-top: 1px solid var(--border);
      -webkit-overflow-scrolling: touch;
      flex-shrink: 0;
    }

    .event-pill {
      font-family: var(--font-hud);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-sec);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .event-pill:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: var(--gold-glow);
    }

    /* ================================================================ HUD & SPLITS TABS */
    #view-hud,
    #view-splits {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
      overflow-y: auto;
    }

    .hud-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
    }

    .hud-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hud-card-title {
      font-family: var(--font-hud);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .hud-card-spd {
      font-family: var(--font-hud);
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
    }

    .hud-card-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      font-size: 0.72rem;
      color: var(--text-sec);
      font-family: var(--font-mono);
    }

    /* ================================================================ BOTTOM NAV */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-h);
      background: rgba(13, 21, 32, 0.95);
      backdrop-filter: blur(15px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      z-index: 2000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      gap: 3px;
      font-size: 0.65rem;
      font-family: var(--font-hud);
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .nav-item.active {
      color: var(--accent);
    }

    /* Canoe Icon */
    .canoe-marker-icon {
      transform-origin: center center;
    }
  </style>
</head>

<body>
  <div id="app">

    <!-- HEADER -->
    <header id="app-header">
      <div class="header-left">
        <span class="header-badge">🏄 VAAREC</span>
        <div>
          <h1 id="hdr-title">Replay Multi-GPS</h1>
          <div class="header-sub" id="hdr-sub">Carregando telemetria...</div>
        </div>
      </div>
      <div class="header-right">
        <button class="icon-btn" onclick="toggleFullscreen()" title="Tela cheia">⛶</button>
        <a href="/" class="icon-btn" title="VAAREC Generator"
          style="text-decoration:none;font-family:var(--font-hud);font-weight:700">GEN</a>
      </div>
    </header>

    <!-- CONTENT AREA -->
    <div id="content-area">

      <!-- TAB: MAPA -->
      <div id="view-map" class="mobile-tab active">
        <div id="map-area">
          <div id="map-detail"></div>

          <!-- Floating Drone Camera Director Widget -->
          <div id="drone-camera-bar">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="drone-bar-title">🎥 Câmera Drone</span>
              <span id="drone-zoom-indicator"
                style="font-size:0.6rem; color:var(--accent); font-weight:700; font-family:var(--font-mono);">Alt:
                35m</span>
            </div>
            <div class="drone-btns">
              <button class="drone-btn active" id="btn-cam-auto" onclick="setCameraDirector('auto')">🎬 Auto</button>
              <button class="drone-btn" id="btn-cam-leader" onclick="setCameraDirector('follow-leader')">👑 Líder</button>
              <button class="drone-btn" id="btn-cam-all" onclick="setCameraDirector('follow-all')">👁️ Todas</button>
              <div id="dynamic-canoe-cam-btns" style="display:inline-flex; gap:4px;"></div>
              <button class="drone-btn" id="btn-cam-overview" onclick="setCameraDirector('overview')">🗺️ Geral</button>
            </div>
            <div
              style="display:flex; gap:3px; align-items:center; margin-top:2px; padding-top:4px; border-top:1px solid rgba(255,255,255,0.08);">
              <span style="font-size:0.58rem; color:#94a3b8; font-weight:700; margin-right:2px;">Altura:</span>
              <button class="drone-btn-mini active" id="btn-alt-close" onclick="setDroneAltitude('close')"
                title="Baixa Altitude (~30m) — Zoom Próximo e Imersivo">Cinemático</button>
              <button class="drone-btn-mini" id="btn-alt-normal" onclick="setDroneAltitude('normal')"
                title="Média Altitude (~60m)">Padrão</button>
              <button class="drone-btn-mini" id="btn-alt-pano" onclick="setDroneAltitude('panoramic')"
                title="Alta Altitude (~150m)">Alto</button>
              <button class="drone-btn-mini" onclick="adjustDroneZoom(1)" title="Aproximar Drone (Zoom In)">🔍+</button>
              <button class="drone-btn-mini" onclick="adjustDroneZoom(-1)" title="Afastar Drone (Zoom Out)">🔍-</button>
            </div>
          </div>

          <!-- Floating Heart Rate (FC) Zone Legend -->
          <div id="hr-legend">
            <div class="hr-legend-title">❤️ Frequência Cardíaca</div>
            <div class="hr-legend-bars">
              <div class="hr-item"><span class="hr-dot" style="background:#06b6d4"></span> Z1 &lt;110</div>
              <div class="hr-item"><span class="hr-dot" style="background:#10b981"></span> Z2 110-130</div>
              <div class="hr-item"><span class="hr-dot" style="background:#f59e0b"></span> Z3 130-150</div>
              <div class="hr-item"><span class="hr-dot" style="background:#f97316"></span> Z4 150-165</div>
              <div class="hr-item"><span class="hr-dot" style="background:#ef4444"></span> Z5 &gt;165</div>
            </div>
          </div>
        </div>

        <!-- COMPACT CONTROLS BAR -->
        <div id="controls-bar">
          <!-- Main Player Bar (Play, Speed, Time, Expand/Collapse Toggle) -->
          <div id="main-player-row">
            <div class="player-left-group">
              <button id="btn-play" onclick="togglePlay()">▶</button>
              <button id="btn-speed-toggle" onclick="cycleSpeed()" title="Velocidade de Reprodução">⚡ 1×</button>
              <div id="time-indicator-pill">00:00:00 / 00:00:00</div>
            </div>
            <button id="btn-toggle-metrics" onclick="toggleMetricsCollapse()">
              <span id="lbl-toggle-metrics">Linha do Tempo</span> <span id="icon-toggle-metrics">🔽</span>
            </button>
          </div>

          <!-- Collapsible Section: Timeline & Metric Distances -->
          <div id="collapsible-metrics">
            <div id="timeline-row">
              <span class="time-display" id="time-cur">00:00</span>
              <div id="timeline-track">
                <div id="timeline-bg"></div>
                <div id="timeline-fill"></div>
                <div id="timeline-handle"></div>
              </div>
              <span class="time-display" id="time-tot">00:00</span>
            </div>
            <div id="dist-row">
              <!-- Dynamic canoe distance stats populated here -->
            </div>
          </div>
        </div>

        <!-- Eventos Notáveis Bar -->
        <div id="events-card-row">
          <div
            style="font-family:var(--font-hud); font-size:0.65rem; font-weight:800; color:var(--gold); letter-spacing:1px; text-transform:uppercase; white-space:nowrap; flex-shrink:0;">
            ⚡ EVENTOS:
          </div>
          <div id="events-pills-list" style="display:flex; align-items:center; gap:6px; flex-wrap:nowrap;">
            <span style="font-size:0.7rem; color:var(--text-muted); font-family:var(--font-hud)">Nenhum evento
              registrado</span>
          </div>
        </div>
      </div>

      <!-- TAB: HUD -->
      <div id="view-hud" class="mobile-tab">
        <div
          style="font-family:var(--font-hud); font-size:1rem; font-weight:800; color:var(--accent); letter-spacing:1px; text-transform:uppercase;">
          📡 Telemetria em Tempo Real
        </div>
        <div class="hud-grid" id="hud-cards-container"></div>
      </div>

      <!-- TAB: SPLITS -->
      <div id="view-splits" class="mobile-tab">
        <div
          style="font-family:var(--font-hud); font-size:1rem; font-weight:800; color:var(--accent); letter-spacing:1px; text-transform:uppercase;">
          📊 Parciais por Km
        </div>
        <div id="splits-table-container"></div>
      </div>

    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <button class="nav-item active" onclick="switchTab('map')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
        </svg>
        Mapa
      </button>
      <button class="nav-item" onclick="switchTab('hud')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />

        Telemetria

      <button class="nav-item" onclick="switchTab('splits')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="20" x2="18" y2="10" />
          <line x1="12" y1="20" x2="12" y2="4" />
          <line x1="6" y1="20" x2="6" y2="14" />

  </div>

  <script>
    // ==========================================
    // VAAREC VIEWER CONTROLLER & REPLAY ENGINE
    // ==========================================
    let CONTRACT = window.CONTRACT || {};
    let map = null;
    let droneCamera = null;
    let tracks = []; // [{ id, name, color, points: [{lat, lon, t, spdKmh, hr, heading}], marker, trailPolyline }]
    let isPlaying = false;
    let playTimeMs = 0;
    let maxDurMs = 0;
    let speedFactor = 1;
    const speedOptions = [1, 2, 5, 10, 30, 60];
    let speedIdx = 0;
    let animTimer = null;
    let lastTimestamp = null;
    let dragging = false;
    let metricsCollapsed = false;

    const TRACK_COLORS = ['#00F2FE', '#F59E0B', '#10B981', '#EF4444', '#8B5CF6', '#F43F5E', '#3B82F6', '#EC4899'];

    // Helpers
    function formatTime(ms) {
      const s = Math.floor((ms || 0) / 1000);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    function haversineM(la1, lo1, la2, lo2) {
      const R = 6371000;
      const dLat = (la2 - la1) * Math.PI / 180;
      const dLon = (lo2 - lo1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(la1 * Math.PI / 180) * Math.cos(la2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function calcBearing(la1, lo1, la2, lo2) {
      const dL = (lo2 - lo1) * Math.PI / 180;
      const rlat1 = la1 * Math.PI / 180, rlat2 = la2 * Math.PI / 180;
      return (Math.atan2(Math.sin(dL) * Math.cos(rlat2), Math.cos(rlat1) * Math.sin(rlat2) - Math.sin(rlat1) * Math.cos(rlat2)) * 180 / Math.PI + 360) % 360;
    }

    function getHRColor(hr) {
      if (!hr || isNaN(hr)) return '#06B6D4';
      if (hr < 110) return '#06B6D4';
      if (hr < 130) return '#10B981';
      if (hr < 150) return '#F59E0B';
      if (hr < 165) return '#F97316';
      return '#EF4444';
    }

    function createCanoeIcon(color, stroke, id, labelText) {
      const sColor = stroke || '#ffffff';
      const svgHtml = `<div style="position:relative; width:140px; height:70px; overflow:visible;">
    <!-- Marcador de Posição Exata no Ponto (70px, 35px) -->
    <div style="position:absolute; left:70px; top:35px; transform:translate(-50%,-50%); width:8px; height:8px; border-radius:50%; background:${color}; border:2px solid #ffffff; box-shadow:0 0 8px ${color}; z-index:1100;"></div>
    <!-- Desenho SVG da Canoa Rotacionado -->
    <svg class="canoe-svg" viewBox="-70 -35 140 70" width="140" height="70" overflow="visible" style="position:absolute; left:0; top:0; z-index:1000;">
      <path d="M -26 0 C -16 -2.8, 16 -2.8, 26 0 C 16 2.8, -16 2.8, -26 0 Z" fill="${color}" stroke="${sColor}" stroke-width="2"/>
      <path d="M 26 0 C 21 -2.2, 21 2.2, 26 0 Z" fill="#ffffff" opacity="0.95"/>
      <line x1="-12" y1="0" x2="-12" y2="-8" stroke="${sColor}" stroke-width="3" stroke-linecap="round"/>
      <line x1="12" y1="0" x2="12" y2="-8" stroke="${sColor}" stroke-width="3" stroke-linecap="round"/>
      <path d="M -18 -8 C -9 -9.5, 9 -9.5, 18 -8 C 9 -6.8, -9 -6.8, -18 -8 Z" fill="${sColor}" stroke="#ffffff" stroke-width="1.5"/>
    </svg>
    <div style="position:absolute; left:82px; top:42px; font-family:'Rajdhani',sans-serif,system-ui; font-size:11px; font-weight:800; color:${color}; text-shadow:1px 1px 3px #000; white-space:nowrap; pointer-events:none; z-index:1110">
      🛶 ${labelText || `Canoa ${id + 1}`} <span id="spd-marker-${id}">--</span> | <span id="hr-marker-${id}" style="color:#FF6B6B">--</span>
    </div>
  </div>`;

      return L.divIcon({
        html: `<div style="position:relative;overflow:visible">${svgHtml}</div>`,
        className: 'canoe-icon-wrap',
        iconSize: [140, 70],
        iconAnchor: [70, 35]
      });
    }

    function rotateCanoe(el, h) {
      if (!el || !map) return;
      const svg = el.querySelector('.canoe-svg');
      if (!svg) return;
      const z = map.getZoom(), lat = map.getCenter().lat;
      const mpp = (156543.03392 * Math.cos(lat * Math.PI / 180)) / Math.pow(2, z);
      const scale = Math.max(0.18, 13.71 / mpp / 52);
      svg.style.transformOrigin = '70px 35px';
      svg.style.transform = `scale(${scale.toFixed(4)}) rotate(${(h - 90).toFixed(1)}deg)`;
    }

    async function fetchGPSFile(filename) {
      if (!filename) return null;
      const cleanName = filename.replace(/^.*[\\\/]/, '');
      const candidateUrls = [
        `./${cleanName}`,
        `../GPS/${cleanName}`,
        `/GPS/${cleanName}`,
        `./GPS/${cleanName}`,
        `./files/${cleanName}`,
        filename
      ];

      for (const url of candidateUrls) {
        try {
          const resp = await fetch(url);
          if (resp.ok) {
            const text = await resp.text();
            if (text && text.trim().length > 0) return text;
          }
        } catch (e) { }
      }
      return null;
    }

    function parseGPXText(xmlText) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");
      const trkpts = Array.from(xmlDoc.getElementsByTagName('trkpt'));
      if (!trkpts.length) return [];

      const rawPoints = [];
      trkpts.forEach(pt => {
        const lat = parseFloat(pt.getAttribute('lat'));
        const lon = parseFloat(pt.getAttribute('lon'));
        const timeEl = pt.getElementsByTagName('time')[0];
        const hrEl = pt.getElementsByTagName('hr')[0] || pt.getElementsByTagName('gpxtpx:hr')[0];
        const spdEl = pt.getElementsByTagName('speed')[0] || pt.getElementsByTagName('gpxtpx:speed')[0];

        const timestamp = timeEl ? new Date(timeEl.textContent).getTime() : 0;
        const hr = hrEl ? parseInt(hrEl.textContent) : null;
        const spdKmh = spdEl ? parseFloat(spdEl.textContent) * 3.6 : undefined;

        if (!isNaN(lat) && !isNaN(lon)) {
          rawPoints.push({ lat, lon, timestamp, hr, spdKmh });
        }
      });
      return rawPoints;
    }

    function parseGarminJSONText(jsonText) {
      try {
        const data = typeof jsonText === 'string' ? JSON.parse(jsonText) : jsonText;
        const descriptors = data.metricDescriptors || [];
        const metricsList = data.activityDetailMetrics || [];

        let latIdx = descriptors.findIndex(d => d.key === 'directLatitude');
        let lngIdx = descriptors.findIndex(d => d.key === 'directLongitude');
        let timeIdx = descriptors.findIndex(d => d.key === 'directTimestamp');
        let hrIdx = descriptors.findIndex(d => d.key === 'directHeartRate');
        let speedIdx = descriptors.findIndex(d => d.key === 'directSpeed');

        if (latIdx === -1) latIdx = 0;
        if (lngIdx === -1) lngIdx = 1;
        if (timeIdx === -1) timeIdx = 3;
        if (hrIdx === -1) hrIdx = 4;
        if (speedIdx === -1) speedIdx = 9;

        const rawPoints = [];
        metricsList.forEach(item => {
          const m = item.metrics;
          if (!m || m.length <= Math.max(latIdx, lngIdx)) return;
          const lat = m[latIdx];
          const lon = m[lngIdx];
          let timestamp = m[timeIdx];
          const hr = m[hrIdx] ? Math.round(m[hrIdx]) : null;
          let spdKmh = m[speedIdx] ? m[speedIdx] * 3.6 : 0;
          if (timestamp && timestamp < 1e11) timestamp = timestamp * 1000;

          if (lat && lon && !isNaN(lat) && !isNaN(lon)) {
            rawPoints.push({ lat, lon, timestamp, hr, spdKmh });
          }
        });
        return rawPoints;
      } catch (e) {
        return [];
      }
    }

    function getTrackPoints(track) {
      if (!track) return [];
      const rawData = track.points || track.data || track.gpsData || [];
      if (!Array.isArray(rawData)) return [];

      return rawData.map(p => {
        if (!p) return null;
        const lat = p.lat != null ? p.lat : p.latitude;
        const lon = p.lon != null ? p.lon : (p.lng != null ? p.lng : p.longitude);
        const t = p.timestamp != null ? Number(p.timestamp) : 
                 (p.t != null ? Number(p.t) : 
                 (p.tRel != null ? Number(p.tRel) : 
                 (p.time ? new Date(p.time).getTime() : null)));
        const spdKmh = p.spdKmh != null ? Number(p.spdKmh) : 
                      (p.speedKmh != null ? Number(p.speedKmh) : 
                      (p.speed != null ? Number(p.speed) * 3.6 : 0));

        if (lat == null || lon == null || t == null || isNaN(lat) || isNaN(lon) || isNaN(t)) return null;
        return { 
          lat: Number(lat), 
          lon: Number(lon), 
          t: Number(t), 
          spdKmh: Number(spdKmh) || 0, 
          hr: p.hr || p.heartRate || null, 
          heading: p.heading != null ? Number(p.heading) : null,
          cadence: p.cadence || null 
        };
      }).filter(Boolean);
    }

    function generateDemoTracks() {
      const startLat = -27.4320, startLon = -48.4850;
      const numPts = 80;
      const tStep = 3000;

      const track1Pts = [];
      const track2Pts = [];

      for (let i = 0; i < numPts; i++) {
        const frac = i / (numPts - 1);
        const t = i * tStep;
        const curve = Math.sin(frac * Math.PI * 2) * 0.003;
        const lat = startLat + frac * 0.025 + curve;
        const lon = startLon + frac * 0.040;
        
        const spd1 = 12.2 + Math.sin(i * 0.3) * 1.5 + (i > 50 ? 0.8 : 0);
        const hr1 = 135 + Math.round(frac * 30 + Math.sin(i * 0.2) * 8);
        track1Pts.push({ lat: lat + 0.0002, lon: lon - 0.0001, t, spdKmh: spd1, hr: hr1 });

        const spd2 = 12.0 + Math.cos(i * 0.3) * 1.4 + (i > 40 && i < 65 ? 1.2 : 0);
        const hr2 = 138 + Math.round(frac * 28 + Math.cos(i * 0.2) * 7);
        track2Pts.push({ lat: lat - 0.0002, lon: lon + 0.0001, t, spdKmh: spd2, hr: hr2 });
      }

      return [
        { name: 'C1 Natureza', color: '#00F2FE', points: track1Pts },
        { name: 'C2 Salvaá', color: '#F59E0B', points: track2Pts }
      ];
    }

    // Inicialização Principal
    async function init() {
      // 1. Tentar resolver CONTRACT de todas as fontes disponíveis
      if (typeof window.CONTRACT !== 'undefined' && (window.CONTRACT.sportPackage || window.CONTRACT.tracks)) {
        CONTRACT = window.CONTRACT;
      } else {
        try {
          const stored = localStorage.getItem('vaarec_sport_package') || localStorage.getItem('vaarec_contract');
          if (stored) {
            const parsed = JSON.parse(stored);
            CONTRACT = parsed.sportPackage ? parsed : { sportPackage: parsed, ...parsed };
          }
        } catch (e) { }

        const params = new URLSearchParams(window.location.search);
        const contractUrl = params.get('contract') || params.get('file');
        if (contractUrl) {
          try {
            const res = await fetch(contractUrl);
            if (res.ok) CONTRACT = await res.json();
          } catch (e) { }
        }
      }

      // Configurar Cabeçalho Limpo
      const hdrTitle = document.getElementById('hdr-title');
      const hdrSub = document.getElementById('hdr-sub');

      const rawTitle = CONTRACT.name || "Replay Multi-GPS";
      const cleanTitle = (rawTitle.includes("Base Espacial") || rawTitle.includes("Circuito Jurerê"))
        ? "VAAREC Replay Multi-GPS"
        : rawTitle;
      hdrTitle.textContent = cleanTitle;

      // 2. Carregar Trilhas do Contrato ou Fallback
      let rawTracks = CONTRACT.sportPackage?.tracks || CONTRACT.tracks || [];
      if (!rawTracks.length) {
        rawTracks = generateDemoTracks();
      }

      let loadedTracks = [];
      for (let idx = 0; idx < rawTracks.length; idx++) {
        const t = rawTracks[idx];
        const color = t.color || TRACK_COLORS[idx % TRACK_COLORS.length];
        let rawPts = getTrackPoints(t);

        if (!rawPts.length && (t.fileName || t.file || t.name)) {
          const fileData = await fetchGPSFile(t.fileName || t.file || `${t.name}.gpx`);
          if (fileData) {
            if (fileData.trim().startsWith('{') || (t.fileName && t.fileName.endsWith('.txt'))) {
              rawPts = parseGarminJSONText(fileData);
            } else {
              rawPts = parseGPXText(fileData);
            }
          }
        }

        if (!rawPts.length) continue;

        const t0 = rawPts[0].t;
        let accDist = 0;
        const pts = [];

        for (let pIdx = 0; pIdx < rawPts.length; pIdx++) {
          const p = rawPts[pIdx];
          const lat = p.lat;
          const lon = p.lon;
          const tMs = p.t - t0;

          if (pts.length > 0) {
            const prev = pts[pts.length - 1];
            accDist += haversineM(prev.lat, prev.lon, lat, lon);
          }

          let heading = p.heading;
          if (heading == null) {
            if (pIdx + 1 < rawPts.length) {
              const nextLat = rawPts[pIdx + 1].lat;
              const nextLon = rawPts[pIdx + 1].lon;
              heading = (!isNaN(nextLat) && !isNaN(nextLon)) ? calcBearing(lat, lon, nextLat, nextLon) : 0;
            } else if (pts.length > 0) {
              heading = pts[pts.length - 1].heading;
            } else {
              heading = 0;
            }
          }

          pts.push({
            lat,
            lon,
            t: tMs,
            spdKmh: Number(p.spdKmh || 0),
            hr: p.hr || null,
            heading: Number(heading || 0),
            accDist
          });
        }

        if (!pts.length) continue;

        const trackDur = pts[pts.length - 1].t;
        if (trackDur > maxDurMs) maxDurMs = trackDur;

        loadedTracks.push({
          id: t.id || `track-${idx + 1}`,
          name: t.name || `Canoa ${idx + 1}`,
          color,
          points: pts,
          totalDistM: accDist,
          maxDurMs: trackDur
        });
      }

      if (!loadedTracks.length) {
        const demo = generateDemoTracks();
        demo.forEach((t, idx) => {
          const pts = t.points.map(p => ({ ...p, accDist: 0 }));
          loadedTracks.push({
            id: `demo-${idx + 1}`,
            name: t.name,
            color: t.color,
            points: pts,
            totalDistM: 1000,
            maxDurMs: pts[pts.length - 1].t
          });
        });
        maxDurMs = loadedTracks[0].maxDurMs;
      }

      tracks = loadedTracks;
      hdrSub.textContent = `${tracks.length} Canoa(s) • Telemetria Oficial`;

      // 3. Inicializar Mapa Leaflet
      const initialCenter = (tracks[0]?.points?.[0])
        ? [tracks[0].points[0].lat, tracks[0].points[0].lon]
        : (CONTRACT.viewport20km?.center ? [CONTRACT.viewport20km.center.lat, CONTRACT.viewport20km.center.lng] : [-27.426, -48.481]);

      map = L.map('map-detail', {
        center: initialCenter,
        zoom: 15,
        zoomControl: false
      });

      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; CartoDB &copy; OpenStreetMap',
        maxZoom: 20
      }).addTo(map);

      L.control.zoom({ position: 'bottom-right' }).addTo(map);
      L.control.scale({ position: 'bottom-left', metric: true, imperial: false }).addTo(map);

      // 4. Desenhar Linhas de Largada e Chegada
      if (CONTRACT.startLine?.p1 && CONTRACT.startLine?.p2) {
        const sl = CONTRACT.startLine;
        L.polyline([[sl.p1.lat, sl.p1.lng || sl.p1.lon], [sl.p2.lat, sl.p2.lng || sl.p2.lon]], {
          color: '#10b981', weight: 4, opacity: 0.9, dashArray: '6,6'
        }).addTo(map).bindTooltip('Linha de Largada', { permanent: false });
      }
      if (CONTRACT.endLine?.p1 && CONTRACT.endLine?.p2) {
        const el = CONTRACT.endLine;
        L.polyline([[el.p1.lat, el.p1.lng || el.p1.lon], [el.p2.lat, el.p2.lng || el.p2.lon]], {
          color: '#ef4444', weight: 4, opacity: 0.9, dashArray: '6,6'
        }).addTo(map).bindTooltip('Linha de Chegada', { permanent: false });
      }

      // 5. Adicionar Marcadores e Polylines das Canoas
      const allCoords = [];
      tracks.forEach((t, i) => {
        if (!t.points.length) return;
        t.trailPolyline = L.polyline([], { color: t.color, weight: 3, opacity: 0.85 }).addTo(map);
        t.marker = L.marker([t.points[0].lat, t.points[0].lon], {
          icon: createCanoeIcon(t.color, '#ffffff', i, t.name),
          zIndexOffset: 1000 + i
        }).addTo(map);
        t._currentHeading = t.points[0].heading || 0;
        rotateCanoe(t.marker.getElement(), t._currentHeading);

        t.points.forEach(p => allCoords.push([p.lat, p.lon]));
      });

      map.on('zoomend', () => {
        tracks.forEach((t) => {
          if (t.marker && t._currentHeading != null) {
            rotateCanoe(t.marker.getElement(), t._currentHeading);
          }
        });
      });

      if (allCoords.length) {
        map.fitBounds(allCoords, { padding: [40, 40] });
      }

      // 5b. Montar Botões Dinâmicos de Canoa na Câmera Drone
      const camCanoesWrap = document.getElementById('dynamic-canoe-cam-btns');
      if (camCanoesWrap) {
        camCanoesWrap.innerHTML = '';
        tracks.forEach((t, i) => {
          const cBtn = document.createElement('button');
          cBtn.className = 'drone-btn';
          cBtn.id = `btn-cam-c${i}`;
          cBtn.style.color = t.color;
          cBtn.textContent = `🛶 C${i + 1}`;
          cBtn.onclick = () => setCameraDirector('follow-canoe', i);
          camCanoesWrap.appendChild(cBtn);
        });
      }

      // 6. Inicializar Drone Camera Skills
      if (typeof DroneCameraSkills !== 'undefined') {
        droneCamera = new DroneCameraSkills({
          map,
          getEntities: () => tracks.map(t => {
            const p = getInterpolatedPoint(t, playTimeMs);
            return {
              lat: Number(p?.lat ?? t.points[0]?.lat),
              lon: Number(p?.lon ?? t.points[0]?.lon),
              heading: Number(p?.heading ?? 0),
              spdKmh: Number(p?.spdKmh ?? 0),
              accDist: Number(p?.accDist ?? 0),
              points: t.points,
              pts: t.points
            };
          }),
          getContract: () => CONTRACT
        });
      }

      // 7. Popular Eventos Notáveis
      renderEvents();

      // 8. Renderizar HUD e Distâncias Iniciais
      updateFrame(0);
      setupTimelineDrag();
    }

    function getInterpolatedPoint(track, timeMs) {
      const pts = track.points;
      if (!pts || !pts.length) return null;
      if (timeMs <= pts[0].t) return pts[0];
      if (timeMs >= pts[pts.length - 1].t) return pts[pts.length - 1];

      let low = 0, high = pts.length - 1;
      while (low <= high) {
        const mid = (low + high) >> 1;
        if (pts[mid].t < timeMs) low = mid + 1;
        else high = mid - 1;
      }
      const i = Math.max(1, low);
      const p1 = pts[i - 1];
      const p2 = pts[i];
      const frac = (p2.t - p1.t) > 0 ? (timeMs - p1.t) / (p2.t - p1.t) : 0;

      const lat = p1.lat + (p2.lat - p1.lat) * frac;
      const lon = p1.lon + (p2.lon - p1.lon) * frac;
      const heading = p1.heading + (p2.heading - p1.heading) * frac;
      const spdKmh = p1.spdKmh + (p2.spdKmh - p1.spdKmh) * frac;
      const hr = p1.hr != null && p2.hr != null ? Math.round(p1.hr + (p2.hr - p1.hr) * frac) : (p1.hr || p2.hr);
      const accDist = p1.accDist + (p2.accDist - p1.accDist) * frac;

      return { lat, lon, heading, spdKmh, hr, accDist, t: timeMs };
    }

    function updateFrame(timeMs) {
      playTimeMs = Math.max(0, Math.min(timeMs, maxDurMs));

      // Atualizar Tempo no HUD
      const curStr = formatTime(playTimeMs);
      const totStr = formatTime(maxDurMs);
      document.getElementById('time-cur').textContent = curStr.slice(3);
      document.getElementById('time-tot').textContent = totStr.slice(3);
      document.getElementById('time-indicator-pill').textContent = `${curStr} / ${totStr}`;

      // Atualizar Barra de Progresso
      const pct = maxDurMs > 0 ? (playTimeMs / maxDurMs) * 100 : 0;
      document.getElementById('timeline-fill').style.width = `${pct}%`;
      document.getElementById('timeline-handle').style.left = `${pct}%`;

      // Atualizar Canoas no Mapa
      let distHtml = '';
      const currentPositions = [];

      tracks.forEach((t, i) => {
        const pt = getInterpolatedPoint(t, playTimeMs);
        if (!pt) return;
        currentPositions.push({ track: t, pt });

        if (t.marker) {
          t.marker.setLatLng([pt.lat, pt.lon]);
          t._currentHeading = pt.heading || 0;
          rotateCanoe(t.marker.getElement(), t._currentHeading);

          const spdEl = document.getElementById(`spd-marker-${i}`);
          if (spdEl) spdEl.textContent = (pt.spdKmh || 0).toFixed(1) + ' km/h';

          const hrEl = document.getElementById(`hr-marker-${i}`);
          if (hrEl) {
            if (pt.hr) {
              const hrColor = getHRColor(pt.hr);
              hrEl.innerHTML = `<span style="color:${hrColor}">❤️ ${Math.round(pt.hr)} bpm</span>`;
            } else {
              hrEl.textContent = '';
            }
          }
        }

        // Atualizar rastro
        if (t.trailPolyline) {
          const trail = t.points.filter(p => p.t <= playTimeMs).map(p => [p.lat, p.lon]);
          trail.push([pt.lat, pt.lon]);
          t.trailPolyline.setLatLngs(trail);
        }

        const distKm = (pt.accDist / 1000).toFixed(2);
        distHtml += `<span style="color:${t.color}"><strong>${t.name}:</strong> ${distKm} km (${pt.spdKmh.toFixed(1)} km/h)</span>`;
      });

      // Calcular Gap se houver 2 canoas
      if (currentPositions.length >= 2) {
        const d1 = currentPositions[0].pt.accDist;
        const d2 = currentPositions[1].pt.accDist;
        const gapM = Math.abs(d1 - d2).toFixed(0);
        const leader = d1 >= d2 ? currentPositions[0].track.name : currentPositions[1].track.name;
        distHtml += `<span style="color:var(--accent)"><strong>GAP:</strong> ${gapM}m (${leader} à frente)</span>`;
      }

      document.getElementById('dist-row').innerHTML = distHtml;

      // Atualizar Câmera Drone
      if (droneCamera) {
        droneCamera.update(playTimeMs);
      }

      // Atualizar HUD Detalhado
      renderHUD(currentPositions);
    }

    function renderHUD(positions) {
      const container = document.getElementById('hud-cards-container');
      if (!container) return;

      container.innerHTML = positions.map(({ track, pt }) => `
    <div class="hud-card" style="border-left: 3px solid ${track.color};">
      <div class="hud-card-title" style="color:${track.color};">${track.name}</div>
      <div class="hud-card-spd">${pt.spdKmh.toFixed(1)} <span style="font-size:0.75rem; color:#94a3b8;">km/h</span></div>
      <div class="hud-card-metrics">
        <div>Dist: ${(pt.accDist / 1000).toFixed(2)} km</div>
        <div>FC: ${pt.hr ? pt.hr + ' bpm' : '--'}</div>
        <div>Proa: ${Math.round(pt.heading)}°</div>
        <div>Ritmo: ${pt.spdKmh > 0 ? (60 / pt.spdKmh).toFixed(1) + ' min/km' : '--'}</div>
      </div>
    </div>
  `).join('');
    }

    function renderEvents() {
      const pList = document.getElementById('events-pills-list');
      const allEvents = CONTRACT.events?.all || CONTRACT.events?.interference || CONTRACT.events?.custom || [];
      if (!allEvents.length || !pList) return;

      pList.innerHTML = allEvents.map((ev, i) => {
        const label = ev.name || ev.description || `Evento ${i + 1}`;
        const tMs = ev.timeMs || (ev.t || 0);
        return `<button class="event-pill" onclick="seekTo(${tMs})">📍 ${label} (${formatTime(tMs).slice(3)})</button>`;
      }).join('');
    }

    function seekTo(ms) {
      playTimeMs = ms;
      updateFrame(playTimeMs);
    }

    // Controles de Reprodução
    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('btn-play');
      btn.textContent = isPlaying ? '⏸' : '▶';

      if (isPlaying) {
        lastTimestamp = performance.now();
        runLoop();
      } else {
        cancelAnimationFrame(animTimer);
      }
    }

    function runLoop() {
      if (!isPlaying) return;
      const now = performance.now();
      const dt = (now - lastTimestamp);
      lastTimestamp = now;

      playTimeMs += dt * speedFactor;
      if (playTimeMs >= maxDurMs) {
        playTimeMs = maxDurMs;
        togglePlay();
      }

      updateFrame(playTimeMs);
      animTimer = requestAnimationFrame(runLoop);
    }

    function cycleSpeed() {
      speedIdx = (speedIdx + 1) % speedOptions.length;
      speedFactor = speedOptions[speedIdx];
      document.getElementById('btn-speed-toggle').textContent = `⚡ ${speedFactor}×`;
    }

    function toggleMetricsCollapse() {
      metricsCollapsed = !metricsCollapsed;
      const coll = document.getElementById('collapsible-metrics');
      const icon = document.getElementById('icon-toggle-metrics');
      if (metricsCollapsed) {
        coll.classList.add('collapsed');
        icon.textContent = '🔼';
      } else {
        coll.classList.remove('collapsed');
        icon.textContent = '🔽';
      }
    }

    // Câmera Drone Handlers
    function setCameraDirector(mode, param) {
      if (!droneCamera) return;
      document.querySelectorAll('.drone-btn').forEach(b => b.classList.remove('active'));

      if (mode === 'auto' || mode === 'smart' || mode === 'lookahead') {
        document.getElementById('btn-cam-auto')?.classList.add('active');
        droneCamera.setMode('auto');
      } else if (mode === 'follow-leader' || mode === 'leader') {
        document.getElementById('btn-cam-leader')?.classList.add('active');
        droneCamera.setMode('follow-leader');
      } else if (mode === 'follow-all' || mode === 'all' || mode === 'todas') {
        document.getElementById('btn-cam-all')?.classList.add('active');
        droneCamera.setMode('follow-all');
      } else if (mode === 'follow-canoe' || mode === 'canoe') {
        const idx = typeof param === 'number' ? param : 0;
        document.getElementById(`btn-cam-c${idx}`)?.classList.add('active');
        droneCamera.setMode('follow-canoe', { canoeIdx: idx });
      } else if (mode === 'overview') {
        document.getElementById('btn-cam-overview')?.classList.add('active');
        droneCamera.setMode('overview');
      }
    }

    function setDroneAltitude(preset) {
      if (!droneCamera) return;
      document.querySelectorAll('.drone-btn-mini').forEach(b => {
        if (b.id && b.id.startsWith('btn-alt-')) b.classList.remove('active');
      });
      if (preset === 'close') document.getElementById('btn-alt-close')?.classList.add('active');
      else if (preset === 'normal') document.getElementById('btn-alt-normal')?.classList.add('active');
      else if (preset === 'panoramic') document.getElementById('btn-alt-pano')?.classList.add('active');

      droneCamera.setAltitudePreset(preset);
      updateDroneIndicator();
    }

    function adjustDroneZoom(delta) {
      if (!droneCamera) return;
      droneCamera.adjustZoomOffset(delta);
      updateDroneIndicator();
    }

    function updateDroneIndicator() {
      const ind = document.getElementById('drone-zoom-indicator');
      if (!ind || !droneCamera) return;
      const z = droneCamera.config.followZoom + (droneCamera.config.zoomOffset || 0);
      const altStr = z >= 20 ? 'Alt: 20m' : z === 19 ? 'Alt: 35m' : z === 18 ? 'Alt: 60m' : z === 17 ? 'Alt: 100m' : 'Alt: 180m';
      ind.textContent = altStr;
    }

    // Timeline Dragging Handler
    function setupTimelineDrag() {
      const track = document.getElementById('timeline-track');
      function seek(e) {
        const rect = track.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const frac = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        playTimeMs = frac * maxDurMs;
        updateFrame(playTimeMs);
      }

      track.addEventListener('mousedown', e => { dragging = true; seek(e); });
      window.addEventListener('mousemove', e => { if (dragging) seek(e); });
      window.addEventListener('mouseup', () => { dragging = false; });
      track.addEventListener('touchstart', e => { dragging = true; seek(e); }, { passive: true });
      window.addEventListener('touchmove', e => { if (dragging) seek(e); }, { passive: true });
      window.addEventListener('touchend', () => { dragging = false; });
    }

    // Tabs
    function switchTab(tabId) {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.querySelectorAll('.mobile-tab').forEach(t => t.classList.remove('active'));

      if (tabId === 'map') {
        document.querySelectorAll('.nav-item')[0].classList.add('active');
        document.getElementById('view-map').classList.add('active');
        setTimeout(() => map?.invalidateSize(), 150);
      } else if (tabId === 'hud') {
        document.querySelectorAll('.nav-item')[1].classList.add('active');
        document.getElementById('view-hud').classList.add('active');
      } else if (tabId === 'splits') {
        document.querySelectorAll('.nav-item')[2].classList.add('active');
        document.getElementById('view-splits').classList.add('active');
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => { });
      } else {
        document.exitFullscreen().catch(() => { });
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>

</html>
