name = "site-elmonte"
compatibility_date = "2024-09-23"

[assets]
directory = "."
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-app"
exclude = [
  ".git",
  ".git/**",
  ".github",
  ".github/**",
  ".gemini",
  ".gemini/**",
  "inteligencia site",
  "inteligencia site/**",
  "*.log",
  "*.bak"
]
